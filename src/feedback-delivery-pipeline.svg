<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="980" height="540" fill="#f8fafc"/>
  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">图 8-9 交付管线四阶段与版本化回滚（8.6）</text>

  <!-- 四阶段漏斗 -->
  <g font-size="13">
    <rect x="60" y="80" width="200" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="110" text-anchor="middle" font-weight="bold" fill="#1e40af">Offline 离线评估</text>
    <text x="160" y="132" text-anchor="middle" font-size="11.5" fill="#475569">Golden Set + 硬门禁</text>
    <text x="160" y="150" text-anchor="middle" font-size="11.5" fill="#475569">50~100 美元/次全量</text>

    <rect x="300" y="80" width="200" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="400" y="110" text-anchor="middle" font-weight="bold" fill="#166534">Shadow 影子测试</text>
    <text x="400" y="132" text-anchor="middle" font-size="11.5" fill="#475569">副本收生产请求</text>
    <text x="400" y="150" text-anchor="middle" font-size="11.5" fill="#475569">输出只记录不使用</text>

    <rect x="540" y="80" width="200" height="90" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="640" y="110" text-anchor="middle" font-weight="bold" fill="#854d0e">Canary 灰度发布</text>
    <text x="640" y="132" text-anchor="middle" font-size="11.5" fill="#475569">10% → 20% → 100%</text>
    <text x="640" y="150" text-anchor="middle" font-size="11.5" fill="#475569">核心指标实时监控</text>

    <rect x="780" y="80" width="160" height="90" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
    <text x="860" y="110" text-anchor="middle" font-weight="bold" fill="#7e22ce">Full Promote</text>
    <text x="860" y="132" text-anchor="middle" font-size="11.5" fill="#475569">全量发布</text>
    <text x="860" y="150" text-anchor="middle" font-size="11.5" fill="#475569">或 Rollback 回滚</text>

    <path d="M260 125 L296 125" stroke="#475569" stroke-width="2.5" marker-end="url(#g1)"/>
    <path d="M500 125 L536 125" stroke="#475569" stroke-width="2.5" marker-end="url(#g1)"/>
    <path d="M740 125 L776 125" stroke="#475569" stroke-width="2.5" marker-end="url(#g1)"/>
  </g>
  <text x="278" y="115" text-anchor="middle" font-size="10.5" fill="#64748b">gate 通过</text>
  <text x="518" y="115" text-anchor="middle" font-size="10.5" fill="#64748b">无差异</text>
  <text x="758" y="115" text-anchor="middle" font-size="10.5" fill="#64748b">达标</text>

  <!-- Rollback 回环 -->
  <path d="M860 174 L860 210 L160 210 L160 174" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#g2)"/>
  <text x="510" y="228" text-anchor="middle" font-size="12.5" fill="#dc2626" font-weight="bold">任意核心指标退步超过预设阈值（违规调用率↑50%、平均成本↑30%…）→ 立即回滚 → 返回 Diagnose</text>

  <!-- Shadow 双模式 -->
  <rect x="60" y="260" width="440" height="200" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="290" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#166534">Shadow 双模式（exp4 shadow_demo.py）</text>
  <g font-size="12" fill="#14532d">
    <text x="80" y="318">offline（无 LLM）：比较两份预记录会话</text>
    <text x="80" y="338">  difflib.unified_diff 对比工具调用序列</text>
    <text x="80" y="358">  diff 为空 → shadow validation PASS</text>
    <text x="80" y="386">live：SystemPromptSubject v1/v2 同一任务</text>
    <text x="80" y="406">  同一 sandbox、同一 capture registry 真跑</text>
    <text x="80" y="426">  输出 first_call / calls 序列 / error 对照</text>
    <text x="80" y="452" font-weight="bold" fill="#166534">工程口径：只有 diff 为空或可解释，才允许进入 Canary</text>
  </g>

  <!-- 版本化 -->
  <rect x="520" y="260" width="420" height="200" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="730" y="290" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#9a3412">版本化：回滚必须是可机器恢复的精确状态</text>
  <g font-size="12" fill="#7c2d12">
    <text x="540" y="318">把 Harness 所有资产视为版本化资源，每次变更打标签：</text>
    <text x="540" y="342">  工具描述版本 v2.3.1 · 系统提示词版本 v1.7.0</text>
    <text x="540" y="366">  rollback_tag = rollback-{version}（ChangeManifest）</text>
    <text x="540" y="394">与模型版本锁定（Pinning）配合使用，杜绝「代码未改</text>
    <text x="540" y="414">但行为变了」的隐式漂移（harness_py_pro/git_ops.py）</text>
    <text x="540" y="442" font-weight="bold" fill="#9a3412">修改提示词 = 走同一发布管线：离线评测 → 通过则发布，</text>
  </g>

  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#475569"/></marker>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/></marker>
  </defs>
</svg>
