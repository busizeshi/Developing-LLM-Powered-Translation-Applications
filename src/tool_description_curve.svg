<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600">
  <style>
    text { font-family: 'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif; fill:#1e293b; }
    .title { font-size: 21px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .axis { font-size: 11.5px; fill: #64748b; }
    .tick { font-size: 11px; fill: #475569; }
    .val { font-size: 11.5px; font-weight: 700; fill: #0369a1; }
    .valb { font-size: 10px; fill: #94a3b8; }
    .note { font-size: 12px; fill: #475569; }
    .warn { font-size: 11.5px; font-weight: 700; fill: #dc2626; }
    .peak { font-size: 12.5px; font-weight: 700; fill: #047857; }
  </style>

  <rect width="980" height="600" fill="#f8fafc"/>
  <text x="490" y="36" text-anchor="middle" class="title">工具描述长度的"倒U"曲线（表 4-4 实验数据）</text>
  <text x="490" y="58" text-anchor="middle" class="subtitle">8 档描述长度 × 23 任务 × 3 seeds = 552 次调用；纵轴均为百分比（%）</text>

  <!-- peak zone -->
  <rect x="490" y="100" width="190" height="340" fill="#ecfdf5" opacity="0.7"/>
  <text x="585" y="92" text-anchor="middle" class="peak">最佳区间 303–521 Token</text>

  <!-- gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="100" x2="880" y2="100"/>
    <line x1="100" y1="185" x2="880" y2="185"/>
    <line x1="100" y1="270" x2="880" y2="270"/>
    <line x1="100" y1="355" x2="880" y2="355"/>
  </g>
  <line x1="100" y1="440" x2="880" y2="440" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="100" y2="440" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="92" y="104" text-anchor="end" class="tick">100</text>
  <text x="92" y="189" text-anchor="end" class="tick">75</text>
  <text x="92" y="274" text-anchor="end" class="tick">50</text>
  <text x="92" y="359" text-anchor="end" class="tick">25</text>
  <text x="92" y="444" text-anchor="end" class="tick">0</text>
  <text x="60" y="275" text-anchor="middle" transform="rotate(-90 60 275)" class="axis">首次调用准确率 / 违规调用率（%）</text>

  <!-- violation rate line (grey dashed) -->
  <polyline points="130,336.6 230,395.8 330,376.1 430,405.7 530,440 630,435.2 730,420.3 830,415.5"
            fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="140" y="330" class="valb">30.4</text>
  <text x="818" y="405" class="valb">7.2</text>
  <text x="330" y="360" class="valb">违规调用率：最优区间归零后回升（灰色虚线）</text>

  <!-- accuracy line -->
  <polyline points="130,218.3 230,149.3 330,173.8 430,169.0 530,109.9 630,109.9 730,139.4 830,154.1"
            fill="none" stroke="#0369a1" stroke-width="2.5"/>

  <!-- points + labels -->
  <g fill="#0369a1">
    <circle cx="130" cy="218.3" r="5"/>
    <circle cx="230" cy="149.3" r="5"/>
    <circle cx="330" cy="173.8" r="5"/>
    <circle cx="430" cy="169.0" r="5"/>
    <circle cx="530" cy="109.9" r="6" stroke="#047857" stroke-width="2.5"/>
    <circle cx="630" cy="109.9" r="6" stroke="#047857" stroke-width="2.5"/>
    <circle cx="730" cy="139.4" r="5"/>
    <circle cx="830" cy="154.1" r="5"/>
  </g>
  <text x="130" y="240" text-anchor="middle" class="val">65.2</text>
  <text x="230" y="171" text-anchor="middle" class="val">85.5</text>
  <text x="330" y="196" text-anchor="middle" class="val">78.3</text>
  <text x="430" y="191" text-anchor="middle" class="val">79.7</text>
  <text x="530" y="130" text-anchor="middle" class="val" fill="#047857">97.1</text>
  <text x="630" y="130" text-anchor="middle" class="val" fill="#047857">97.1</text>
  <text x="730" y="161" text-anchor="middle" class="val">88.4</text>
  <text x="830" y="176" text-anchor="middle" class="val">84.1</text>

  <!-- x ticks -->
  <g text-anchor="middle" class="tick">
    <text x="130" y="462">15</text>
    <text x="230" y="462">45</text>
    <text x="330" y="462">80</text>
    <text x="430" y="462">146</text>
    <text x="530" y="462">303</text>
    <text x="630" y="462">521</text>
    <text x="730" y="462">761</text>
    <text x="830" y="462">1172</text>
  </g>
  <text x="490" y="486" text-anchor="middle" class="axis">描述长度（Token 数）</text>

  <!-- annotations -->
  <rect x="100" y="510" width="780" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="118" y="534" class="note">① 太短（15–80）约束信息不足，模型只能猜参数语义 → 准确率 65–85% 徘徊，违规调用率最高 30.4%；</text>
  <text x="118" y="554" class="note">② 303–521 Token 双峰 97.1%：示例 + 边界条件 + 返回格式说明带来最强信号，违规调用率压到 0–1.4%；</text>
  <text x="118" y="574" class="note">③ 超过 521 后"过约束反噬"：准确率 88.4% → 84.1%，bash 成功使用率 95.8% → 75.0% —— 超长描述稀释信号、推高注意力成本。</text>
</svg>
