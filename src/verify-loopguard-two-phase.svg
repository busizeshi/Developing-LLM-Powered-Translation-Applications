<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#f8fafc"/>
  <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">LoopGuard：教学版单阶段 vs 生产版两阶段</text>
  <text x="490" y="68" text-anchor="middle" font-size="13" fill="#64748b">harness_py/loop_guard.py（4 种检测）与 harness_py_pro/loop_guard.py（对齐 DeepSeek-TUI）</text>

  <!-- ===== 上：主循环中的位置 ===== -->
  <rect x="40" y="92" width="900" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="60" y="118" font-size="12.5" font-weight="700" fill="#0f172a">在 Agent 主循环中的位置（agent.py）</text>
  <text x="60" y="146" font-size="12" fill="#334155">… → LLM 调用 → <tspan font-weight="700" fill="#7c3aed">工具执行</tspan> → <tspan font-weight="700" fill="#ea580c">guard.check(tool, args, ok, preview)</tspan> → 介入时注入 <tspan font-family="monospace" fill="#dc2626">&lt;system-reminder&gt;[LOOP GUARD] …&lt;/system-reminder&gt;</tspan> → 下一轮 …</text>
  <text x="60" y="166" font-size="11" fill="#64748b">介入不是抛异常终止，而是向上下文注入一条消息——模型读到后通常立即换路，任务得以继续</text>

  <!-- ===== 左：教学版 ===== -->
  <rect x="40" y="200" width="440" height="270" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <rect x="40" y="200" width="440" height="44" rx="12" fill="#7c3aed"/>
  <rect x="40" y="222" width="440" height="22" fill="#7c3aed"/>
  <text x="260" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">教学版 LoopGuard.check()—— 每次调用后统一检查</text>

  <rect x="64" y="262" width="392" height="54" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="78" y="283" font-size="12" font-weight="700" fill="#5b21b6">检测1 · 相同调用重复（MD5 签名滑动窗口）</text>
  <text x="78" y="302" font-size="11" fill="#6d28d9">sig = tool + md5(json.dumps(args, sort_keys=True))[:12]，窗口 10 条，尾部 3 条全同 → 介入</text>

  <rect x="64" y="324" width="392" height="42" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="78" y="342" font-size="12" font-weight="700" fill="#5b21b6">检测2 · 连续错误累积</text>
  <text x="78" y="359" font-size="11" fill="#6d28d9">连续失败 ≥5 次 → 介入；任何一次成功立即清零</text>

  <rect x="64" y="374" width="392" height="42" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="78" y="392" font-size="12" font-weight="700" fill="#5b21b6">检测3 · 同工具连续使用</text>
  <text x="78" y="409" font-size="11" fill="#6d28d9">同一工具连续 ≥10 次 → 介入；换工具即重置</text>

  <rect x="64" y="424" width="392" height="36" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="78" y="440" font-size="12" font-weight="700" fill="#5b21b6">检测4 · 总量熔断</text>
  <text x="210" y="455" font-size="11" fill="#6d28d9">总调用 &gt;100 次 → 介入（默认阈值 max_total_tool_calls=100）</text>

  <!-- ===== 右：生产版两阶段 ===== -->
  <rect x="500" y="200" width="440" height="270" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
  <rect x="500" y="200" width="440" height="44" rx="12" fill="#0f172a"/>
  <rect x="500" y="222" width="440" height="22" fill="#0f172a"/>
  <text x="720" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">生产版两阶段守卫（对齐 DeepSeek-TUI 阈值）</text>

  <rect x="524" y="262" width="392" height="86" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="540" y="285" font-size="12.5" font-weight="700" fill="#9a3412">阶段一 check_pre()：执行前 —— Block @ 3</text>
  <text x="540" y="306" font-size="11" fill="#c2410c">key = (tool_name, canonical_json(args))；canonical JSON 键递归排序，</text>
  <text x="540" y="324" font-size="11" fill="#c2410c">参数顺序不同也算同一次调用。第 3 次相同调用 → 不执行工具，</text>
  <text x="540" y="340" font-size="11" fill="#c2410c">直接返回 Block（acceptance_check 工具豁免）</text>

  <rect x="524" y="358" width="392" height="98" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="540" y="381" font-size="12.5" font-weight="700" fill="#1e40af">阶段二 check_post()：执行后 —— Warn @ 3 / Halt @ 8</text>
  <text x="540" y="402" font-size="11" fill="#1d4ed8">同一工具连续失败 3 次 → warn（注入警告，模型下轮可见）；</text>
  <text x="540" y="420" font-size="11" fill="#1d4ed8">连续失败 8 次 → halt（终止 Agent 循环）；</text>
  <text x="540" y="440" font-size="11" fill="#1d4ed8">任何一次成功 → 该工具失败计数清零（与教学版一致的复位语义）</text>

  <!-- ===== 底部结论 ===== -->
  <rect x="40" y="492" width="900" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="490" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">验证守卫的本质：用 O(1) 的确定性哈希与计数器，换取「尾部场景不被烧穿」—— 平时不触发，触发时不可或缺乏</text>
  <text x="490" y="531" text-anchor="middle" font-size="11" fill="#166534">F4 实测：死循环发生时 turns 25 vs 10（+150%）、cost $0.022 vs $0.005（+340%）</text>
</svg>
