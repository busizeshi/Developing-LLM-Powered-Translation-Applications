<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="980" height="460" fill="#f8fafc"/>
  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">图 8-1 控制论映射：Plant（被控对象）与 Controller（控制器）</text>

  <!-- 参考输入 -->
  <text x="90" y="88" font-size="13" fill="#475569">目标：任务完成率↑</text>
  <text x="90" y="106" font-size="13" fill="#475569">指标不回退</text>

  <!-- Plant 大框 -->
  <rect x="60" y="130" width="400" height="290" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="260" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">Plant 被控对象（第 2~7 章构造）</text>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#475569">直接执行任务的 Harness 六层补偿面</text>

  <g font-size="13" fill="#1e3a8a">
    <rect x="85" y="200" width="160" height="34" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="165" y="222" text-anchor="middle">约束层（规则）</text>
    <rect x="275" y="200" width="160" height="34" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="355" y="222" text-anchor="middle">工具层（MCP）</text>
    <rect x="85" y="248" width="160" height="34" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="165" y="270" text-anchor="middle">上下文层</text>
    <rect x="275" y="248" width="160" height="34" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="355" y="270" text-anchor="middle">记忆层</text>
    <rect x="85" y="296" width="160" height="34" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="165" y="318" text-anchor="middle">验证层</text>
    <rect x="275" y="296" width="160" height="34" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="355" y="318" text-anchor="middle">编排层</text>
  </g>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#64748b">输出：会话日志 / 工具调用序列 / Token 消耗</text>
  <text x="260" y="388" text-anchor="middle" font-size="12" fill="#64748b">任务成功率 / 成本数据 / 失败案例</text>

  <!-- Controller 大框 -->
  <rect x="560" y="130" width="360" height="290" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="740" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">Controller 控制器（第 8 章主角）</text>
  <text x="740" y="182" text-anchor="middle" font-size="12" fill="#475569">测量与调节：不直接执行任务</text>

  <g font-size="13" fill="#14532d">
    <rect x="585" y="205" width="310" height="30" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="740" y="225" text-anchor="middle">① 观测偏差（Observe）</text>
    <rect x="585" y="245" width="310" height="30" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="740" y="265" text-anchor="middle">② 诊断归因（Diagnose）→ 定位到层</text>
    <rect x="585" y="285" width="310" height="30" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="740" y="305" text-anchor="middle">③ 生成调节量（Candidate 提案）</text>
    <rect x="585" y="325" width="310" height="30" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="740" y="345" text-anchor="middle">④ 施加于补偿面（规则/工具/上下文/验证…）</text>
  </g>
  <text x="740" y="395" text-anchor="middle" font-size="12" fill="#64748b">对应 feedback_loop.py：mine_failures → generate_candidate</text>

  <!-- 前向通路 -->
  <path d="M 460 230 L 556 230" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
  <text x="508" y="220" text-anchor="middle" font-size="12" fill="#ea580c" font-weight="bold">调节 u(t)</text>

  <!-- 反馈通路 -->
  <path d="M 740 420 L 740 440 L 260 440 L 260 424" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
  <text x="500" y="434" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">反馈 y(t)：日志、指标、失败案例、成本数据</text>

  <defs>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="490" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">负反馈：减少「观测值 − 目标值」的偏差；正反馈（危险）：强化偏差导致失控</text>
</svg>
