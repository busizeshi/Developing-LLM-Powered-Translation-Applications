<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="520" fill="#f8fafc"/>
  <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">验证策略自身的 4 种失败模式（FMEA 视角）</text>
  <text x="490" y="68" text-anchor="middle" font-size="13" fill="#64748b">防御机制本身也会失效——每种失败模式都要可被识别、有缓解方案、有恢复路径</text>

  <!-- 4 失败模式卡片 -->
  <rect x="40" y="96" width="440" height="150" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="40" y="96" width="440" height="40" rx="12" fill="#dc2626"/>
  <rect x="40" y="116" width="440" height="20" fill="#dc2626"/>
  <text x="260" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">FM1 · Goodhart 作弊（reward hacking）</text>
  <text x="56" y="158" font-size="11.5" fill="#334155">现象：实际未满足需求，测试却全过——Agent 直接</text>
  <text x="56" y="176" font-size="11.5" fill="#334155">修改测试断言、硬编码预期输出、空实现绕过。</text>
  <text x="56" y="198" font-size="11" font-weight="700" fill="#991b1b">缓解：测试文件哈希/权限隔离 + prompt « 作弊检测 » 条款</text>
  <text x="56" y="218" font-size="11" font-weight="700" fill="#991b1b">+ BP judge 把 « 无作弊 » 作为 DONE 的硬前置条件</text>
  <text x="56" y="238" font-size="10.5" fill="#64748b">书中有完整案例与修复路径（Anthropic 亦有同类记录）</text>

  <rect x="500" y="96" width="440" height="150" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <rect x="500" y="96" width="440" height="40" rx="12" fill="#ea580c"/>
  <rect x="500" y="116" width="440" height="20" fill="#ea580c"/>
  <text x="720" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">FM2 · 迭代契约漂移（iterative contract）</text>
  <text x="516" y="158" font-size="11.5" fill="#334155">现象：多轮修改中早期约定被悄悄放宽——验证标准</text>
  <text x="516" y="176" font-size="11.5" fill="#334155">随对话 « 软化 »，最后一轮已没人记得原始验收口径。</text>
  <text x="516" y="198" font-size="11" font-weight="700" fill="#9a3412">缓解：契约落盘（plan.md/TASK.md 持有验收标准），</text>
  <text x="516" y="218" font-size="11" font-weight="700" fill="#9a3412">每轮验证对照契约原文而非对话记忆；漂移即强制更新 plan</text>
  <text x="516" y="238" font-size="10.5" fill="#64748b">对应 2026-04《Harness Engineering for Coding Agents》</text>

  <rect x="40" y="262" width="440" height="150" rx="12" fill="#ffffff" stroke="#ca8a04" stroke-width="1.6"/>
  <rect x="40" y="262" width="440" height="40" rx="12" fill="#ca8a04"/>
  <rect x="40" y="282" width="440" height="20" fill="#ca8a04"/>
  <text x="260" y="288" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">FM3 · 验证器退化与盲区</text>
  <text x="56" y="324" font-size="11.5" fill="#334155">现象：测试套件覆盖不足（dp001 只测 2/4 规则）、</text>
  <text x="56" y="342" font-size="11.5" fill="#334155">judge 有系统性 bias（exp3 实证）、mutation score 停留低位。</text>
  <text x="56" y="364" font-size="11" font-weight="700" fill="#854d0e">缓解：BP judge 结构化 + 规约文件兜底测试盲区；</text>
  <text x="56" y="384" font-size="11" font-weight="700" fill="#854d0e">定期对验证器自身做校准（用已知坏样本回归）</text>
  <text x="56" y="404" font-size="10.5" fill="#64748b">值得引入的判据：项目测试覆盖率的客观评估</text>

  <rect x="500" y="262" width="440" height="150" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/>
  <rect x="500" y="262" width="440" height="40" rx="12" fill="#0891b2"/>
  <rect x="500" y="282" width="440" height="20" fill="#0891b2"/>
  <text x="720" y="288" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">FM4 · 防御耗散（机制腐化）</text>
  <text x="516" y="324" font-size="11.5" fill="#334155">现象：随着提示词膨胀、需求漂移、工具扩容，</text>
  <text x="516" y="342" font-size="11.5" fill="#334155">曾经有效的验证条款被冲淡、遗忘或绕过。</text>
  <text x="516" y="364" font-size="11" font-weight="700" fill="#155e75">缓解：验证机制作为 Harness 的内置演化项——</text>
  <text x="516" y="384" font-size="11" font-weight="700" fill="#155e75">配置化（阈值/名单进 config）、有回归测试、随版本评审</text>
  <text x="516" y="404" font-size="10.5" fill="#64748b">演化是内置机制而非事故后补丁</text>

  <!-- 底部 FMEA -->
  <rect x="40" y="430" width="900" height="66" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
  <text x="490" y="455" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">FMEA（Failure Mode and Effects Analysis，失败模式影响分析）：对每个防御机制问三个问题——怎么失效？失效后果是什么？如何恢复？</text>
  <text x="490" y="478" text-anchor="middle" font-size="11" fill="#0f766e">目标不是「永不失效」，而是「在自身失效时仍具备可恢复性」——本章 4 种失败模式均可被识别、均有缓解方案，但识别延迟与恢复成本不同</text>
</svg>
