<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrLRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrLGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#f8fafc"/>
  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">最小验证闭环（Verify Loop）：把「完成」的定义交给确定性代码</text>
  <text x="490" y="66" text-anchor="middle" font-size="13" fill="#64748b">通过率 40% → 80~100% 的全部秘密：验收标准从 Agent 嘴里搬到框架手里</text>

  <!-- Agent 循环框 -->
  <rect x="70" y="110" width="380" height="330" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="260" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Agent 循环（Generator · 概率性）</text>

  <rect x="105" y="160" width="310" height="44" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="260" y="187" text-anchor="middle" font-size="13" fill="#1e3a8a">① 接收任务 + 工具集（read/edit/bash）</text>

  <rect x="105" y="220" width="310" height="44" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="260" y="247" text-anchor="middle" font-size="13" fill="#1e3a8a">② 模型推理：编辑代码 / 调用工具</text>

  <rect x="105" y="280" width="310" height="44" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="260" y="307" text-anchor="middle" font-size="13" fill="#1e3a8a">③ 工具执行 + LoopGuard 检查</text>

  <rect x="105" y="340" width="310" height="56" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="260" y="363" text-anchor="middle" font-size="13" fill="#9a3412">④ 报告「任务完成」（自评，不可信）</text>
  <text x="260" y="383" text-anchor="middle" font-size="11.5" fill="#c2410c">虚假阳性率高达 60%（exp1 数据）</text>

  <!-- 闭环验证器框 -->
  <rect x="540" y="110" width="380" height="330" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="730" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">验证器（Evaluator · 确定性）</text>

  <rect x="575" y="160" width="310" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="730" y="182" text-anchor="middle" font-size="13" fill="#14532d">⑤ 框架独立运行 pytest（Agent 无法干预）</text>
  <text x="730" y="202" text-anchor="middle" font-size="11.5" fill="#15803d">subprocess 隔离 · 只看 returncode == 0</text>

  <rect x="575" y="228" width="310" height="44" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="730" y="255" text-anchor="middle" font-size="13" fill="#14532d">⑥ 对照验收清单（acceptance_check）</text>

  <rect x="575" y="288" width="310" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="730" y="310" text-anchor="middle" font-size="13" fill="#14532d">⑦ 分类：真完成 / 虚假阳性 / 悲观 / 未完成</text>
  <text x="730" y="330" text-anchor="middle" font-size="11.5" fill="#15803d">self_report × pytest_pass 四象限判定</text>

  <rect x="575" y="356" width="310" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="730" y="378" text-anchor="middle" font-size="13" fill="#14532d">⑧ FAIL → 错误信号回灌重试（stderr 注入）</text>
  <text x="730" y="398" text-anchor="middle" font-size="11.5" fill="#15803d">一次重试 +40pp 通过率，成本约 +$0.003</text>

  <!-- 流程箭头 -->
  <line x1="450" y1="255" x2="540" y2="255" stroke="#475569" stroke-width="2.5" marker-end="url(#arrL)"/>
  <text x="495" y="243" text-anchor="middle" font-size="11.5" fill="#475569">提交完成</text>
  <line x1="540" y1="368" x2="455" y2="368" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrL)"/>
  <text x="497" y="358" text-anchor="middle" font-size="11.5" fill="#475569">自评</text>

  <!-- 回灌箭头 -->
  <path d="M 575 395 C 520 480 420 500 300 490" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrLRed)"/>
  <text x="438" y="478" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626">FAIL：pytest stderr 回灌（结构化反馈）</text>

  <!-- 通过箭头 -->
  <line x1="730" y1="440" x2="730" y2="488" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrLGreen)"/>
  <text x="745" y="478" font-size="12.5" font-weight="700" fill="#16a34a">PASS → 任务真正完成</text>

  <!-- 底部数据条 -->
  <rect x="70" y="520" width="850" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="92" y="548" font-size="13.5" font-weight="700" fill="#0f172a">exp2 实证（DeepSeek-V3，5 任务 × 3 档）</text>
  <rect x="92" y="560" width="250" height="20" rx="4" fill="#fecaca"/>
  <text x="100" y="575" font-size="11.5" fill="#7f1d1d">O1 无验证：40%</text>
  <rect x="352" y="560" width="250" height="20" rx="4" fill="#fed7aa"/>
  <text x="360" y="575" font-size="11.5" fill="#7c2d12">O2 给 bash 但不强制：40%（≈无提升）</text>
  <rect x="612" y="560" width="250" height="20" rx="4" fill="#bbf7d0"/>
  <text x="620" y="575" font-size="11.5" fill="#14532d">O3 框架强制闭环 + 重试：80~100%</text>
</svg>
