<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="三层文档架构金字塔：全局层、项目层、任务层自下而上拼接，右侧标注各层职责，底部为文档发现机制流程">
  <style>
    text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;}
    .t{font-size:18px;font-weight:700;fill:#171717;}
    .n-title{font-size:14px;font-weight:600;fill:#171717;}
    .n-sub{font-size:12px;fill:#52525B;}
    .mono{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;}
    .ct{font-size:12.5px;font-weight:600;fill:#52525B;}
    .band-t{font-size:15px;font-weight:700;}
    .band-s{font-size:11px;}
    .conn{fill:none;stroke:rgba(23,23,23,0.25);stroke-width:1.2;}
    .flow{fill:none;stroke:#52525B;stroke-width:1.5;stroke-linecap:round;}
  </style>
  <defs>
    <marker id="arr-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
    <marker id="arr-brand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
    </marker>
  </defs>

  <text x="30" y="36" class="t">三层文档架构：Context Builder 的金字塔</text>
  <text x="30" y="58" class="n-sub">图 5-1 复现 · 拼接自下而上：全局 → 项目 → 任务；越靠下越稳定（缓存友好），越靠上越具体（贴近当前任务）</text>

  <!-- 拼接顺序箭头 -->
  <line x1="52" y1="452" x2="52" y2="128" class="flow" marker-end="url(#arr-brand)"/>
  <text x="64" y="284" class="n-title" fill="#4B3FE3">拼接顺序</text>
  <text x="64" y="302" class="n-sub">自下而上</text>
  <text x="64" y="320" class="mono" font-size="10.5" fill="#52525B">base+project+rules</text>

  <!-- 金字塔三层 -->
  <polygon points="205,110 295,110 342,222 158,222" fill="#F7F7F8" stroke="rgba(23,23,23,0.18)"/>
  <text x="250" y="160" text-anchor="middle" class="band-t" fill="#171717">任务层</text>
  <text x="250" y="182" text-anchor="middle" class="band-s" fill="#52525B">会话级 · 即时约束</text>

  <polygon points="150,230 350,230 405,342 95,342" fill="#EDEBFF" stroke="#C7C3F5"/>
  <text x="250" y="280" text-anchor="middle" class="band-t" fill="#4B3FE3">项目层</text>
  <text x="250" y="302" text-anchor="middle" class="band-s" fill="#52525B">项目根 · 团队共享</text>

  <polygon points="87,350 413,350 465,462 35,462" fill="#4B3FE3" stroke="#4B3FE3"/>
  <text x="250" y="400" text-anchor="middle" class="band-t" fill="#FFFFFF">全局层</text>
  <text x="250" y="422" text-anchor="middle" class="band-s" fill="rgba(255,255,255,0.82)">个人偏好 · 跨项目</text>

  <!-- 连接线 -->
  <line x1="322" y1="166" x2="505" y2="158" class="conn"/>
  <line x1="382" y1="286" x2="505" y2="278" class="conn"/>
  <line x1="436" y1="406" x2="505" y2="398" class="conn"/>

  <!-- 右侧注释卡 -->
  <rect x="505" y="110" width="225" height="96" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="521" y="134" class="n-title">任务层 · 任务输入</text>
  <text x="521" y="154" class="n-sub" font-size="11">本次任务的具体约束与输出要求</text>
  <text x="521" y="172" class="n-sub" font-size="11">例：只改 tests/，结果输出 JSON</text>
  <text x="521" y="190" class="n-sub" font-size="11">不落盘，由代码在拼装时注入</text>

  <rect x="505" y="230" width="225" height="96" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="521" y="254" class="n-title">项目层 · 团队共享</text>
  <text x="521" y="274" class="n-sub" font-size="11">CLAUDE.md / AGENTS.md / rules/</text>
  <text x="521" y="292" class="n-sub" font-size="11">构建测试命令 · 架构 · 规范 · 禁令</text>
  <text x="521" y="310" class="n-sub" font-size="11">进版本库，克隆即用</text>

  <rect x="505" y="350" width="225" height="96" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="521" y="374" class="n-title">全局层 · 个人偏好</text>
  <text x="521" y="394" class="mono" font-size="11" fill="#52525B">~/.claude/CLAUDE.md</text>
  <text x="521" y="412" class="n-sub" font-size="11">Python 3.10+ · 个人代码习惯</text>
  <text x="521" y="430" class="n-sub" font-size="11">跨项目生效，随 dotfiles 走</text>

  <!-- 底部：文档发现机制 -->
  <rect x="30" y="496" width="700" height="84" rx="12" fill="#FAFAFA" stroke="rgba(23,23,23,0.12)" stroke-dasharray="6 4"/>
  <text x="46" y="521" class="ct">文档发现机制（prompt.py）：从 cwd 出发自动收集全部层级文档</text>
  <g>
    <rect x="46" y="532" width="122" height="36" rx="18" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <text x="107" y="554" text-anchor="middle" class="n-sub" font-size="11">向上遍历父目录</text>
    <line x1="170" y1="550" x2="182" y2="550" class="flow" marker-end="url(#arr-muted)"/>
    <rect x="184" y="532" width="122" height="36" rx="18" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <text x="245" y="554" text-anchor="middle" class="n-sub" font-size="11">收集 CLAUDE.md 等</text>
    <line x1="308" y1="550" x2="320" y2="550" class="flow" marker-end="url(#arr-muted)"/>
    <rect x="322" y="532" width="122" height="36" rx="18" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <text x="383" y="554" text-anchor="middle" class="n-sub" font-size="11">递归 rules/*.md</text>
    <line x1="446" y1="550" x2="458" y2="550" class="flow" marker-end="url(#arr-muted)"/>
    <rect x="460" y="532" width="122" height="36" rx="18" fill="#FFFFFF" stroke="rgba(23,23,23,0.14)"/>
    <text x="521" y="554" text-anchor="middle" class="n-sub" font-size="11">先全局后项目合并</text>
    <line x1="584" y1="550" x2="596" y2="550" class="flow" marker-end="url(#arr-muted)"/>
    <rect x="598" y="532" width="122" height="36" rx="18" fill="#4B3FE3" stroke="#4B3FE3"/>
    <text x="659" y="554" text-anchor="middle" class="n-sub" font-size="11" fill="#FFFFFF">MUST 强调生效</text>
  </g>
</svg>
