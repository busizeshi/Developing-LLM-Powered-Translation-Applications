<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">图 6-3　Token 预算五区分配（TokenBudget.allocate）</text>
  <text x="440" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">先给"必保项"划地盘，剩余 max(0, budget) 全部留给历史区 —— 历史区是唯一可牺牲的弹性区</text>

  <!-- 主条：x 90→810，共 720px = 100% -->
  <!-- System 10% -->
  <rect x="90" y="120" width="72" height="84" fill="#1e8e3e"/>
  <rect x="90" y="120" width="72" height="84" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="126" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">System</text>
  <text x="126" y="170" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">10%</text>

  <!-- 当前工具结果 5% -->
  <rect x="162" y="120" width="36" height="84" fill="#12b5cb"/>
  <rect x="162" y="120" width="36" height="84" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="180" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">工具</text>
  <text x="180" y="168" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5%</text>

  <!-- Memory 20% -->
  <rect x="198" y="120" width="144" height="84" fill="#7b1fa2"/>
  <rect x="198" y="120" width="144" height="84" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="270" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">长期记忆 Memory</text>
  <text x="270" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">20%</text>

  <!-- 历史区 50% -->
  <rect x="342" y="120" width="360" height="84" fill="#1a73e8"/>
  <rect x="342" y="120" width="360" height="84" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="522" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">历史对话区（弹性区）</text>
  <text x="522" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">50%</text>
  <text x="522" y="192" text-anchor="middle" font-size="11" fill="#dbe7ff">被 L0/L1/L2/L3 逐级压缩的对象</text>

  <!-- 输出预留 15% -->
  <rect x="702" y="120" width="108" height="84" fill="#e8710a"/>
  <rect x="702" y="120" width="108" height="84" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="756" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">输出预留</text>
  <text x="756" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">15%</text>

  <!-- 阈值刻度：70% / 85% / 95% -->
  <g>
    <line x1="594" y1="204" x2="594" y2="258" stroke="#188038" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="594" y="274" text-anchor="middle" font-size="12.5" fill="#188038" font-weight="700">0.70</text>
    <text x="594" y="290" text-anchor="middle" font-size="11" fill="#5f6368">none：健康</text>

    <line x1="702" y1="204" x2="702" y2="258" stroke="#e8710a" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="702" y="274" text-anchor="middle" font-size="12.5" fill="#e8710a" font-weight="700">0.85</text>
    <text x="702" y="290" text-anchor="middle" font-size="11" fill="#5f6368">触发压缩 should_compress</text>

    <line x1="774" y1="204" x2="774" y2="258" stroke="#d93025" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="774" y="274" text-anchor="middle" font-size="12.5" fill="#d93025" font-weight="700">0.95</text>
    <text x="774" y="290" text-anchor="middle" font-size="11" fill="#5f6368">危险（升级到 L3）</text>
  </g>

  <!-- 底部说明卡片 -->
  <g>
    <rect x="90" y="318" width="214" height="112" rx="8" fill="#f6f9ff" stroke="#c6dafc"/>
    <text x="197" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#185abc">必保项（先切走）</text>
    <text x="102" y="364" font-size="11.5" fill="#374151">· System 提示词：行为契约</text>
    <text x="102" y="382" font-size="11.5" fill="#374151">· 当前工具结果：正在用的证据</text>
    <text x="102" y="400" font-size="11.5" fill="#374151">· Memory：跨会话记忆束</text>
    <text x="102" y="418" font-size="11.5" fill="#374151">· 输出预留：防响应被截断</text>

    <rect x="322" y="318" width="240" height="112" rx="8" fill="#f6f9ff" stroke="#c6dafc"/>
    <text x="442" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#185abc">弹性区（唯一可压缩）</text>
    <text x="334" y="364" font-size="11.5" fill="#374151">· 承载全部对话历史</text>
    <text x="334" y="382" font-size="11.5" fill="#374151">· 压缩时四级火箭逐级作用于此</text>
    <text x="334" y="400" font-size="11.5" fill="#374151">· 挤压到极限仍不够 → 升级压缩级别</text>
    <text x="334" y="418" font-size="11.5" fill="#374151">· 历史区 = max(0, budget − 必保项)</text>

    <rect x="580" y="318" width="230" height="112" rx="8" fill="#fff8f0" stroke="#f5d0a9"/>
    <text x="695" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#b06000">经验阈值（压力比）</text>
    <text x="592" y="364" font-size="11.5" fill="#374151">· 压力比 = 已用 / 总预算</text>
    <text x="592" y="382" font-size="11.5" fill="#374151">· 85% 触发 → 95% 危险 → 100% 被截断</text>
    <text x="592" y="400" font-size="11.5" fill="#374151">· 阈值留缓冲：等爆了再压就晚了</text>
    <text x="592" y="418" font-size="11.5" fill="#374151">· decide_compression 按区间选动作</text>
  </g>

  <text x="440" y="450" text-anchor="middle" font-size="11.5" fill="#9ca3af">复现自书图 6-3：五区比例 0.10 / 0.05 / 0.20 / 0.15（输出）· 历史区取剩余</text>
</svg>
