<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">图 6-2　渐进式有损压缩：四级阶梯模型</text>
  <text x="440" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">compress() 按级试探：L0 → L1 → L2 → L3，每级执行后重新计量，达标即停</text>

  <!-- 轴：成本↑ -->
  <line x1="70" y1="420" x2="70" y2="96" stroke="#374151" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text x="52" y="262" text-anchor="middle" font-size="13" fill="#374151" font-weight="600" transform="rotate(-90 52 262)">压缩强度 / 成本</text>
  <line x1="70" y1="420" x2="828" y2="420" stroke="#374151" stroke-width="1.6"/>
  <text x="450" y="446" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">触发顺序（先便宜后昂贵）</text>

  <!-- L0 -->
  <rect x="104" y="308" width="158" height="112" rx="8" fill="#e8f5ec" stroke="#34a853" stroke-width="2"/>
  <rect x="104" y="308" width="158" height="30" rx="8" fill="#34a853"/>
  <text x="183" y="329" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">L0　硬性截断</text>
  <text x="183" y="358" text-anchor="middle" font-size="12" fill="#1f2937">microcompact 长度切片</text>
  <text x="183" y="376" text-anchor="middle" font-size="12" fill="#1f2937">preserve 默认 4 条</text>
  <text x="183" y="394" text-anchor="middle" font-size="12" fill="#188038" font-weight="700">成本 ≈ 0 · 零语义丢失</text>
  <text x="183" y="410" text-anchor="middle" font-size="11" fill="#5f6368">仅按字符数裁剪</text>

  <!-- L1 -->
  <rect x="286" y="242" width="158" height="178" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <rect x="286" y="242" width="158" height="30" rx="8" fill="#1a73e8"/>
  <text x="365" y="263" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">L1　缩略替换</text>
  <text x="365" y="292" text-anchor="middle" font-size="12" fill="#1f2937">snip：旧结果压成一行</text>
  <text x="365" y="310" text-anchor="middle" font-size="12" fill="#1f2937">tool&gt;200 / agent&gt;600</text>
  <text x="365" y="328" text-anchor="middle" font-size="12" fill="#1f2937">每轮最多 3 条</text>
  <text x="365" y="348" text-anchor="middle" font-size="12" fill="#185abc" font-weight="700">成本 ≈ 0 · 保留摘要行</text>
  <text x="365" y="366" text-anchor="middle" font-size="11" fill="#5f6368">[snipped: {preview}...]</text>
  <text x="365" y="398" text-anchor="middle" font-size="11" fill="#5f6368">不对称阈值：小结果零替换</text>

  <!-- L2 -->
  <rect x="468" y="164" width="158" height="256" rx="8" fill="#fef3e2" stroke="#e8710a" stroke-width="2"/>
  <rect x="468" y="164" width="158" height="30" rx="8" fill="#e8710a"/>
  <text x="547" y="185" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">L2　语义摘要</text>
  <text x="547" y="214" text-anchor="middle" font-size="12" fill="#1f2937">_compact：模型迭代摘要</text>
  <text x="547" y="232" text-anchor="middle" font-size="12" fill="#1f2937">Hermes 6 段式：</text>
  <text x="547" y="249" text-anchor="middle" font-size="11" fill="#5f6368">Goal | Done | In Progress</text>
  <text x="547" y="264" text-anchor="middle" font-size="11" fill="#5f6368">Decisions | Files | Next</text>
  <text x="547" y="284" text-anchor="middle" font-size="12" fill="#1f2937">candidates[:20] × [:300]</text>
  <text x="547" y="304" text-anchor="middle" font-size="12" fill="#b06000" font-weight="700">1 次 API · 可控损失</text>
  <text x="547" y="324" text-anchor="middle" font-size="11" fill="#5f6368">摘要 &lt;30 字判失败并回退</text>
  <text x="547" y="340" text-anchor="middle" font-size="11" fill="#5f6368">失败回退 prefix+tail</text>
  <text x="547" y="360" text-anchor="middle" font-size="11" fill="#5f6368">压缩后重读 CLAUDE.md</text>
  <text x="547" y="398" text-anchor="middle" font-size="11" fill="#5f6368">Compact Instructions 锁目标</text>

  <!-- L3 -->
  <rect x="650" y="96" width="158" height="324" rx="8" fill="#fdecea" stroke="#d93025" stroke-width="2"/>
  <rect x="650" y="96" width="158" height="30" rx="8" fill="#d93025"/>
  <text x="729" y="117" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">L3　应急压缩</text>
  <text x="729" y="146" text-anchor="middle" font-size="12" fill="#1f2937">reactive 模式：极限省流</text>
  <text x="729" y="164" text-anchor="middle" font-size="12" fill="#1f2937">preserve 减半 max(preserve//2,1)</text>
  <text x="729" y="182" text-anchor="middle" font-size="12" fill="#1f2937">至多循环 6 轮</text>
  <text x="729" y="204" text-anchor="middle" font-size="12" fill="#b3261e" font-weight="700">2 次 API · 低保留</text>
  <text x="729" y="222" text-anchor="middle" font-size="11" fill="#5f6368">历史区大幅让位给 Memory</text>
  <text x="729" y="238" text-anchor="middle" font-size="11" fill="#5f6368">保进程、不保细节</text>
  <text x="729" y="256" text-anchor="middle" font-size="11" fill="#5f6368">修孤儿配对 _fix_orphaned</text>
  <text x="729" y="398" text-anchor="middle" font-size="11" fill="#5f6368">仅压力 ≥ 0.95 时启用</text>

  <!-- 顶部注释箭头 -->
  <g font-size="12.5" fill="#4b5563">
    <text x="440" y="88" text-anchor="middle" font-weight="600">越靠后：越贵、丢失越多，但释放的窗口空间越大</text>
  </g>
  <path d="M183,96 L729,84" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr2)"/>

  <!-- 底部注脚 -->
  <text x="440" y="468" text-anchor="middle" font-size="11.5" fill="#9ca3af">表 6-2 复现：L0 零成本零丢失 / L1 低成本低丢失 / L2 语义摘要 1 次 API / L3 应急 2 次 API 低保留</text>
</svg>
