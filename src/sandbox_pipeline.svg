<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="980" height="700" fill="#f8fafc"/>
  <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Sandbox.check_tool_call()：四步检查流水线</text>
  <text x="490" y="68" text-anchor="middle" font-size="13" fill="#64748b">串联检查，任一失败立即拒绝（fail-closed）—— 拒绝理由会返回给模型，引导它换路</text>

  <!-- 输入 -->
  <rect x="40" y="300" width="180" height="90" rx="12" fill="#0f172a"/>
  <text x="130" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">工具调用</text>
  <text x="130" y="358" text-anchor="middle" font-size="11.5" fill="#94a3b8">tool_name + arguments</text>
  <text x="130" y="376" text-anchor="middle" font-size="11.5" fill="#94a3b8">如 bash{command: ...}</text>

  <line x1="220" y1="345" x2="258" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 检查1 -->
  <rect x="260" y="96" width="400" height="118" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="282" y="126" font-size="14.5" font-weight="700" fill="#5b21b6">Step 1 · 权限模式检查 check_permission()</text>
  <text x="282" y="150" font-size="11.5" fill="#6d28d9">PLAN：只许读 ｜ ASK：读写需用户确认（默认）</text>
  <text x="282" y="170" font-size="11.5" fill="#6d28d9">ACCEPT：读写自动放行，执行/联网仍需确认</text>
  <text x="282" y="190" font-size="11.5" fill="#6d28d9">BYPASS：全部放行（仅限可信环境）· 确认超时 = 拒绝</text>

  <!-- 检查2 -->
  <rect x="260" y="226" width="400" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="282" y="256" font-size="14.5" font-weight="700" fill="#1e40af">Step 2 · 文件系统策略 FilesystemPolicy</text>
  <text x="282" y="280" font-size="11.5" fill="#1d4ed8">L0 符号链接拦截 → L1 敏感路径不可覆盖（.ssh/.aws/credentials</text>
  <text x="282" y="300" font-size="11.5" fill="#1d4ed8">/.git/config）→ L1.5 敏感文件名（.env、id_rsa）</text>
  <text x="282" y="320" font-size="11.5" fill="#1d4ed8">→ L2 allowed_roots 白名单 → L3 denied_patterns 黑名单</text>
  <text x="282" y="340" font-size="11.5" fill="#1d4ed8">→ L4 只读路径 → L5 写入大小上限（防 zip 炸弹）</text>

  <!-- 检查3 -->
  <rect x="260" y="378" width="400" height="112" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="282" y="408" font-size="14.5" font-weight="700" fill="#115e59">Step 3 · 网络策略 NetworkPolicy</text>
  <text x="282" y="432" font-size="11.5" fill="#0f766e">deny_by_default=True：默认全禁，白名单放行</text>
  <text x="282" y="452" font-size="11.5" fill="#0f766e">拦 curl/wget/ssh/nc 等命令；扫 import socket/requests 等模块；</text>
  <text x="282" y="472" font-size="11.5" fill="#0f766e">剥离 HTTP_PROXY 等代理环境变量</text>

  <!-- 检查4 -->
  <rect x="260" y="502" width="400" height="112" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="282" y="532" font-size="14.5" font-weight="700" fill="#9a3412">Step 4 · 危险命令与内容检查</text>
  <text x="282" y="556" font-size="11.5" fill="#c2410c">正则黑名单：rm -rf / 、mkfs、dd of=/dev/、chmod -R 777 /、</text>
  <text x="282" y="576" font-size="11.5" fill="#c2410c">git push --force、git reset --hard</text>
  <text x="282" y="596" font-size="11.5" fill="#c2410c">+ 命令中的 .. 穿越与 Windows 绝对路径检测</text>

  <!-- 拒绝分支 -->
  <line x1="660" y1="155" x2="742" y2="155" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <line x1="660" y1="296" x2="742" y2="296" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <line x1="660" y1="434" x2="742" y2="434" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <line x1="660" y1="558" x2="742" y2="558" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <text x="700" y="146" font-size="10.5" font-weight="600" fill="#dc2626">失败</text>

  <rect x="746" y="96" width="200" height="520" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="846" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">拒绝执行 BLOCK</text>
  <text x="846" y="152" text-anchor="middle" font-size="11" fill="#b91c1c">返回 (False, 原因字符串)</text>
  <line x1="770" y1="170" x2="922" y2="170" stroke="#fecaca" stroke-width="1"/>
  <text x="762" y="196" font-size="11.5" font-weight="700" fill="#991b1b">关键设计：</text>
  <text x="762" y="218" font-size="11" fill="#7f1d1d">拒绝不是终点，而是反馈 ——</text>
  <text x="762" y="238" font-size="11" fill="#7f1d1d">「敏感路径保护: ../.ssh/id_rsa」</text>
  <text x="762" y="258" font-size="11" fill="#7f1d1d">模型读到原因后，下一轮会</text>
  <text x="762" y="278" font-size="11" fill="#7f1d1d">主动改用合规路径继续任务</text>
  <line x1="770" y1="298" x2="922" y2="298" stroke="#fecaca" stroke-width="1"/>
  <text x="762" y="324" font-size="11.5" font-weight="700" fill="#991b1b">fail-closed：</text>
  <text x="762" y="346" font-size="11" fill="#7f1d1d">用户确认超时 30s → 视为拒绝</text>
  <text x="762" y="366" font-size="11" fill="#7f1d1d">confirm_fn 异常 → 视为拒绝</text>
  <text x="762" y="386" font-size="11" fill="#7f1d1d">宁可中止，不可放行</text>
  <line x1="770" y1="406" x2="922" y2="406" stroke="#fecaca" stroke-width="1"/>
  <text x="762" y="432" font-size="11.5" font-weight="700" fill="#991b1b">统计上报：</text>
  <text x="762" y="454" font-size="11" fill="#7f1d1d">sandbox.stats 记录 checks/blocks，</text>
  <text x="762" y="474" font-size="11" fill="#7f1d1d">拦截率可观测、可回归测试</text>

  <!-- 通过分支 -->
  <line x1="460" y1="614" x2="460" y2="646" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="472" y="636" font-size="11" font-weight="600" fill="#16a34a">四步全部通过</text>
  <rect x="330" y="648" width="260" height="42" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="674" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">批准执行 ALLOW</text>
</svg>
