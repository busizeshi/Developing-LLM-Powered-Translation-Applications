<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="980" height="520" fill="#f8fafc"/>
  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">图 8-2 三类反馈信号：覆盖互补，不可互相替代</text>

  <!-- 三列卡片 -->
  <g>
    <rect x="40" y="70" width="290" height="330" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="185" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">在线信号（生产日志）</text>
    <text x="185" y="124" text-anchor="middle" font-size="12" fill="#64748b">真实分布 · 持续 · 事后</text>
    <g font-size="12.5" fill="#1e3a8a">
      <text x="60" y="158">• 会话数 / 交互轮数 / 挂钟时间</text>
      <text x="60" y="182">• 工具调用次数 / 错误率 / 耗时</text>
      <text x="60" y="206">• Token 消耗（输入/输出/缓存）</text>
      <text x="60" y="230">• 缓存命中率</text>
      <text x="60" y="254">• 失败案例（error_class 分布）</text>
      <text x="60" y="278">• 幻觉率 / 上下文填充比例</text>
      <text x="60" y="302">• 压缩触发率 / 任务中断率</text>
    </g>
    <rect x="60" y="330" width="250" height="52" rx="8" fill="#dbeafe"/>
    <text x="185" y="351" text-anchor="middle" font-size="11.5" fill="#1e40af">优势：无观测偏差，反映真实用户</text>
    <text x="185" y="369" text-anchor="middle" font-size="11.5" fill="#1e40af">短板：无法穷举长尾，滞后于故障</text>
  </g>

  <g>
    <rect x="345" y="70" width="290" height="330" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="490" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">离线信号（评估集）</text>
    <text x="490" y="124" text-anchor="middle" font-size="12" fill="#64748b">Golden Set · 可复现 · 事前</text>
    <g font-size="12.5" fill="#14532d">
      <text x="365" y="158">• 评测任务集（典型用户意图）</text>
      <text x="365" y="182">• 期望工具调用序列</text>
      <text x="365" y="206">• 期望输出内容 / 禁止信号</text>
      <text x="365" y="230">• 首次调用准确率 / 禁用工具触发率</text>
      <text x="365" y="254">• 平均成本 / 调用次数</text>
      <text x="365" y="278">• A/B 对照（同一任务集跑两版）</text>
    </g>
    <rect x="365" y="330" width="250" height="52" rx="8" fill="#dcfce7"/>
    <text x="490" y="351" text-anchor="middle" font-size="11.5" fill="#166534">优势：可批量复现、成本低（数元/次）、</text>
    <text x="490" y="369" text-anchor="middle" font-size="11.5" fill="#166534">可 A/B；短板：覆盖不了生产长尾</text>
  </g>

  <g>
    <rect x="650" y="70" width="290" height="330" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="795" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">对抗信号（Red Team）</text>
    <text x="795" y="124" text-anchor="middle" font-size="12" fill="#64748b">恶意分布 · 最坏情况 · 定期</text>
    <g font-size="12.5" fill="#7f1d1d">
      <text x="670" y="158">• 提示词注入攻击</text>
      <text x="670" y="182">• 权限提升路径探测</text>
      <text x="670" y="206">• 敏感信息泄露（PII/密钥）</text>
      <text x="670" y="230">• 跨会话状态污染</text>
      <text x="670" y="254">• 供应链投毒（恶意 MCP）</text>
      <text x="670" y="278">• 拦截率 = 发布硬门禁</text>
    </g>
    <rect x="670" y="330" width="250" height="52" rx="8" fill="#fee2e2"/>
    <text x="795" y="351" text-anchor="middle" font-size="11.5" fill="#991b1b">优势：覆盖「恶意行为分布」；</text>
    <text x="795" y="369" text-anchor="middle" font-size="11.5" fill="#991b1b">短板：成本高、不可穷尽</text>
  </g>

  <!-- 底部汇聚 -->
  <path d="M 185 404 L 185 440 L 460 470" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <path d="M 490 404 L 490 462" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <path d="M 795 404 L 795 440 L 520 470" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <rect x="360" y="452" width="260" height="44" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="490" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">信号仲裁 → 候选变更</text>
  <text x="490" y="488" text-anchor="middle" font-size="11" fill="#64748b">同一偏差被多类信号同时报告时才有高置信</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/></marker>
  </defs>
</svg>
