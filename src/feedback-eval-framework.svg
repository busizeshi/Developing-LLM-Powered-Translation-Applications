<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="980" height="540" fill="#f8fafc"/>
  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">图 8-8 离线 Eval 基础设施：Subject / Task / Runner 三件套（8.3）</text>

  <!-- 三件套 -->
  <g>
    <rect x="40" y="70" width="280" height="200" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="100" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#1e40af">Subject 被测对象</text>
    <text x="180" y="122" text-anchor="middle" font-size="11.5" fill="#64748b">唯一接口：apply() / revert()</text>
    <g font-size="12" fill="#1e3a8a">
      <text x="60" y="150">• tool_description：替换工具描述</text>
      <text x="60" y="172">• system_prompt：注入系统提示词</text>
      <text x="60" y="194">• memory_layout / skill_registry…</text>
    </g>
    <rect x="60" y="214" width="240" height="42" rx="8" fill="#dbeafe"/>
    <text x="180" y="232" text-anchor="middle" font-size="11" fill="#1e40af">v2 正式配置面：SystemPromptSubject 通过</text>
    <text x="180" y="248" text-anchor="middle" font-size="11" fill="#1e40af">AgentConfig.role_prompt 注入，不再 monkey patch</text>

    <rect x="350" y="70" width="280" height="200" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="490" y="100" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#166534">Task（Golden Set 一条）</text>
    <text x="490" y="122" text-anchor="middle" font-size="11.5" fill="#64748b">用户输入 + 期望/禁止信号</text>
    <g font-size="12" fill="#14532d">
      <text x="370" y="150">正向：expected_first_call</text>
      <text x="370" y="170">      expected_calls / contains</text>
      <text x="370" y="194">反向：forbidden_calls</text>
      <text x="370" y="214">      forbidden_contains</text>
    </g>
    <rect x="370" y="228" width="240" height="30" rx="8" fill="#dcfce7"/>
    <text x="490" y="248" text-anchor="middle" font-size="11" fill="#166534">期望 = 可机器判定的确定性断言</text>

    <rect x="660" y="70" width="280" height="200" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="800" y="100" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#854d0e">Runner 评测运行器</text>
    <text x="800" y="122" text-anchor="middle" font-size="11.5" fill="#64748b">固定模型 / seed / 任务集</text>
    <g font-size="12" fill="#713f12">
      <text x="680" y="150">with subject:            # apply</text>
      <text x="680" y="170">  for task in tasks:</text>
      <text x="680" y="190">    for seed in seeds:</text>
      <text x="680" y="210">      obs = run_one(task, seed)</text>
    </g>
    <rect x="680" y="222" width="240" height="36" rx="8" fill="#fef9c3"/>
    <text x="800" y="240" text-anchor="middle" font-size="11" fill="#854d0e">产出 Observation → score() 聚合为</text>
    <text x="800" y="254" text-anchor="middle" font-size="11" fill="#854d0e">首次调用准确率 / 违禁触发率 / 成本</text>
  </g>

  <!-- 底部：CaptureOnlyTool 与 CLAUDE.md 隔离 -->
  <rect x="40" y="300" width="440" height="190" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="260" y="330" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#9a3412">CaptureOnlyTool：只读真跑，写入假成功</text>
  <g font-size="12" fill="#7c2d12">
    <text x="60" y="358">• 只读工具（read/glob/grep）：真实执行，Agent 看到真内容</text>
    <text x="60" y="380">• 写入工具（write/edit/bash）：返回 (simulated) 假成功，无副作用</text>
    <text x="60" y="406">为什么不用 pre_tool hook 拦截？hook 拦截会让 Agent 收到</text>
    <text x="60" y="426">[HOOK拦截] 错误 → 触发「假 recovery」（换工具重试）→ 污染指标。</text>
    <text x="60" y="450">直接包工具让 Agent 看到「调用成功」，工作流自然推进。</text>
    <text x="60" y="474" font-weight="bold" fill="#9a3412">MAX_CAPTURES_PER_TASK = 5（防 Agent 跑飞的熔断）</text>
  </g>

  <rect x="500" y="300" width="440" height="190" rx="14" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="720" y="330" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#7e22ce">CLAUDE.md 隔离：eval 不得被仓库规则污染</text>
  <g font-size="12" fill="#6b21a8">
    <text x="520" y="358">默认 discover_claude_md() 从 cwd 向上递归找 CLAUDE.md，</text>
    <text x="520" y="378">会把仓库根的规则拉进 system prompt 污染对照组。</text>
    <text x="520" y="404">框架 monkey-patch 为「只查 cwd 自身，不向上遍历」：</text>
    <text x="520" y="424">eval 场景下各 Subject 从同一起跑线出发。</text>
    <text x="520" y="450">工程要点（exp1 README）：验证的不是「某个 prompt 一定更好」，</text>
    <text x="520" y="470">而是 eval 框架可以跨 Harness 层复用 —— 同一 Runner 承载不同层</text>
  </g>

  <text x="490" y="522" text-anchor="middle" font-size="12" fill="#64748b">实现：experiments/ch08/exp1_eval_framework_extended/framework.py（355 行，无 LLM 可自检）</text>
</svg>
