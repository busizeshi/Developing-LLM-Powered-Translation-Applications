<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#f8fafc"/>
  <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">运行时安全网：TokenBudget 与 LoopGuard</text>
  <text x="490" y="68" text-anchor="middle" font-size="13" fill="#64748b">约束层不仅防「恶意」，更防「失控」—— 预算耗尽与死循环是长任务最常见的失败</text>

  <!-- ===== TokenBudget ===== -->
  <rect x="50" y="96" width="880" height="212" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="74" y="128" font-size="16" font-weight="700" fill="#0f172a">TokenBudget：上下文窗口的分区预算（frozen dataclass，128K 示例）</text>
  <text x="74" y="150" font-size="11.5" fill="#64748b">原则：先给输出和系统提示词留死保底，剩余空间才分配给历史 —— 80% 满即触发压缩</text>

  <!-- 分区条 -->
  <!-- 总宽 832，从 x=74 到 x=906。50%+20%+15%+10%+5% = 100% -->
  <rect x="74"  y="170" width="416" height="52" fill="#94a3b8"/>
  <rect x="490" y="170" width="166" height="52" fill="#60a5fa"/>
  <rect x="656" y="170" width="125" height="52" fill="#34d399"/>
  <rect x="781" y="170" width="83"  height="52" fill="#fbbf24"/>
  <rect x="864" y="170" width="42"  height="52" fill="#f472b6"/>
  <rect x="74" y="170" width="832" height="52" fill="none" stroke="#334155" stroke-width="1.2"/>

  <text x="282" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">历史会话 history</text>
  <text x="282" y="210" text-anchor="middle" font-size="11" fill="#f1f5f9">50% · 64K tokens</text>
  <text x="573" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">当前任务 20%</text>
  <text x="573" y="209" text-anchor="middle" font-size="10.5" fill="#1e3a5f">25.6K</text>
  <text x="718" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">输出保留 15%</text>
  <text x="718" y="209" text-anchor="middle" font-size="10.5" fill="#065f46">19.2K</text>
  <text x="822" y="191" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">系统 10%</text>
  <text x="822" y="207" text-anchor="middle" font-size="10" fill="#92400e">12.8K</text>
  <text x="885" y="191" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9d174d">记忆</text>
  <text x="885" y="207" text-anchor="middle" font-size="10" fill="#9d174d">5%</text>

  <text x="74" y="252" font-size="11.5" font-weight="600" fill="#334155">运行逻辑：</text>
  <text x="160" y="252" font-size="11.5" fill="#475569">每次调用前估算 token 占用 → 超过 80% 阈值触发 Compressor 压缩历史 → 仍超限则熔断本次调用</text>
  <text x="74" y="274" font-size="11.5" font-weight="600" fill="#334155">为什么先留输出？</text>
  <text x="190" y="274" font-size="11.5" fill="#475569">上下文塞满时模型连回答都写不下 —— 输出保留区是「死保底」，绝不允许历史侵占</text>
  <text x="74" y="296" font-size="11.5" font-weight="600" fill="#334155">成本护栏：</text>
  <text x="160" y="296" font-size="11.5" fill="#475569">AgentConfig.max_cost_usd=2.0、max_iterations=200 与 Token 预算共同构成三重熔断</text>

  <!-- ===== LoopGuard ===== -->
  <rect x="50" y="330" width="880" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="74" y="362" font-size="16" font-weight="700" fill="#0f172a">LoopGuard：每次工具调用后检查的循环守卫</text>
  <text x="74" y="384" font-size="11.5" fill="#64748b">check(tool_name, tool_args, result_ok, result_preview) → (should_intervene, message)：命中即注入一条系统消息打断循环</text>

  <!-- 5 检测条件卡片 -->
  <g>
    <rect x="74" y="404" width="160" height="118" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="154" y="430" text-anchor="middle" font-size="20" font-weight="800" fill="#dc2626">≥3</text>
    <text x="154" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">完全相同调用</text>
    <text x="154" y="470" text-anchor="middle" font-size="10" fill="#991b1b">MD5 签名 = tool + args</text>
    <text x="154" y="486" text-anchor="middle" font-size="10" fill="#991b1b">哈希 + 结果预览</text>
    <text x="154" y="506" text-anchor="middle" font-size="10" fill="#b91c1c">典型：反复读同一文件</text>
  </g>
  <g>
    <rect x="248" y="404" width="160" height="118" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
    <text x="328" y="430" text-anchor="middle" font-size="20" font-weight="800" fill="#ea580c">≥5</text>
    <text x="328" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">连续失败</text>
    <text x="328" y="470" text-anchor="middle" font-size="10" fill="#9a3412">result_ok=False 连续计数</text>
    <text x="328" y="486" text-anchor="middle" font-size="10" fill="#9a3412">成功一次即清零</text>
    <text x="328" y="506" text-anchor="middle" font-size="10" fill="#c2410c">典型：路径写错反复重试</text>
  </g>
  <g>
    <rect x="422" y="404" width="160" height="118" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
    <text x="502" y="430" text-anchor="middle" font-size="20" font-weight="800" fill="#ca8a04">≥10</text>
    <text x="502" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">同工具连续调用</text>
    <text x="502" y="470" text-anchor="middle" font-size="10" fill="#854d0e">工具名连续计数</text>
    <text x="502" y="486" text-anchor="middle" font-size="10" fill="#854d0e">切换工具即清零</text>
    <text x="502" y="506" text-anchor="middle" font-size="10" fill="#a16207">典型：grep 刷屏式搜索</text>
  </g>
  <g>
    <rect x="596" y="404" width="160" height="118" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="676" y="430" text-anchor="middle" font-size="20" font-weight="800" fill="#059669">100</text>
    <text x="676" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">总调用熔断</text>
    <text x="676" y="470" text-anchor="middle" font-size="10" fill="#047857">max_total_tool_calls</text>
    <text x="676" y="486" text-anchor="middle" font-size="10" fill="#047857">强制总结进度收尾</text>
    <text x="676" y="506" text-anchor="middle" font-size="10" fill="#059669">典型：任务膨胀跑偏</text>
  </g>
  <g>
    <rect x="770" y="404" width="160" height="118" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="850" y="430" text-anchor="middle" font-size="20" font-weight="800" fill="#2563eb">10</text>
    <text x="850" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">滑动窗口签名</text>
    <text x="850" y="470" text-anchor="middle" font-size="10" fill="#1e40af">最近 10 条调用中</text>
    <text x="850" y="486" text-anchor="middle" font-size="10" fill="#1e40af">完全相同即报警</text>
    <text x="850" y="506" text-anchor="middle" font-size="10" fill="#1d4ed8">典型：间歇性重复</text>
  </g>

  <text x="74" y="542" font-size="11.5" font-weight="600" fill="#334155">介入方式不是报错终止：</text>
  <text x="250" y="542" font-size="11.5" fill="#475569">向上下文注入「检测到死循环，请换一种完全不同的策略」—— 模型读到后通常立即换路，任务得以继续</text>

  <!-- 底部结论 -->
  <rect x="50" y="562" width="880" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="490" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">这是「约束即效率」的另一面：预算防浪费，守卫防空转，省下的全是 Token 与时间</text>
</svg>
