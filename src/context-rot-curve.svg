<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="noise" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <circle cx="3" cy="4" r="1.3" fill="#6b7280" opacity="0.5"/>
      <circle cx="10" cy="9" r="1.1" fill="#6b7280" opacity="0.35"/>
      <circle cx="6" cy="12" r="0.9" fill="#6b7280" opacity="0.4"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">图 6-1　上下文腐烂：有效信息占比随轮次衰减</text>
  <text x="440" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">窗口越大不代表记得越多 —— 旧信息不清理，噪声会持续累积、挤占注意力</text>

  <!-- 绘图区框线 -->
  <rect x="90" y="85" width="730" height="285" fill="#fafbfc" stroke="#e5e7eb"/>

  <!-- 噪声累积区（灰色，随轮次升高） -->
  <path d="M90,370 L90,362 L171,352 L252,338 L333,320 L414,299 L495,277 L576,257 L657,240 L738,226 L820,214 L820,370 Z" fill="url(#noise)"/>
  <path d="M90,370 L90,362 L171,352 L252,338 L333,320 L414,299 L495,277 L576,257 L657,240 L738,226 L820,214 L820,370 Z" fill="#9aa3af" opacity="0.16"/>
  <text x="620" y="345" font-size="12.5" fill="#6b7280" font-weight="600">灰色噪点：过期工具输出与冗余文本累积区</text>
  <text x="620" y="362" font-size="11.5" fill="#9ca3af">（信噪比塌陷 + 注意力衰减）</text>

  <!-- y 轴刻度：0/2/4/6/8% -->
  <g font-size="12" fill="#4b5563" text-anchor="end">
    <text x="82" y="374">0%</text>
    <text x="82" y="329">2%</text>
    <text x="82" y="284">4%</text>
    <text x="82" y="239">6%</text>
    <text x="82" y="194">8%</text>
  </g>
  <g stroke="#e5e7eb" stroke-dasharray="3 4">
    <line x1="90" y1="325" x2="820" y2="325"/>
    <line x1="90" y1="280" x2="820" y2="280"/>
    <line x1="90" y1="235" x2="820" y2="235"/>
    <line x1="90" y1="190" x2="820" y2="190"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="90" y1="370" x2="828" y2="370" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="90" y1="370" x2="90" y2="78" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="440" y="404" text-anchor="middle" font-size="13.5" fill="#374151" font-weight="600">对话轮次</text>
  <text x="52" y="228" text-anchor="middle" font-size="13.5" fill="#374151" font-weight="600" transform="rotate(-90 52 228)">有效信息占比</text>
  <g font-size="11.5" fill="#4b5563" text-anchor="middle">
    <text x="90" y="386">1</text><text x="171" y="386">2</text><text x="252" y="386">3</text>
    <text x="333" y="386">4</text><text x="414" y="386">5</text><text x="495" y="386">6</text>
    <text x="576" y="386">7</text><text x="657" y="386">8</text><text x="738" y="386">9</text>
    <text x="819" y="386">10</text>
  </g>

  <!-- 未压缩实线（红） -->
  <path d="M90,212.5 L171,246 L252,275.5 L333,293.5 L414,307 L495,316 L576,322.8 L657,327.3 L738,331.8 L819,336.3"
        fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90" cy="212.5" r="4" fill="#d93025"/>
  <circle cx="819" cy="336.3" r="4" fill="#d93025"/>

  <!-- 启用压缩虚线（蓝，阶梯回升） -->
  <path d="M90,212.5 L171,246 L252,275.5
           L263,275.5 L263,230.5 L333,230.5 L333,230.5 L414,257.5 L495,275.5
           L506,275.5 L506,239.5 L576,239.5 L657,262 L738,275.5
           L749,275.5 L749,246.3 L819,246.3 L819,257.5"
        fill="none" stroke="#1a73e8" stroke-width="3" stroke-dasharray="9 5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 压缩触发标记 -->
  <g>
    <line x1="263" y1="212" x2="263" y2="278" stroke="#1a73e8" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="506" y1="212" x2="506" y2="278" stroke="#1a73e8" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.7"/>
    <line x1="749" y1="212" x2="749" y2="278" stroke="#1a73e8" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="M263,206 l-6,-10 h12 Z" fill="#1a73e8"/>
    <path d="M506,206 l-6,-10 h12 Z" fill="#1a73e8"/>
    <path d="M749,206 l-6,-10 h12 Z" fill="#1a73e8"/>
    <text x="263" y="188" text-anchor="middle" font-size="11.5" fill="#1a73e8" font-weight="600">L2 压缩</text>
    <text x="506" y="188" text-anchor="middle" font-size="11.5" fill="#1a73e8" font-weight="600">L2 压缩</text>
    <text x="749" y="188" text-anchor="middle" font-size="11.5" fill="#1a73e8" font-weight="600">L2 压缩</text>
  </g>

  <!-- 关键数据标注 -->
  <g>
    <rect x="98" y="118" width="196" height="46" rx="7" fill="#fdecea" stroke="#f5c6c1"/>
    <text x="196" y="137" text-anchor="middle" font-size="12.5" fill="#b3261e" font-weight="700">第 1 轮：约 1500 Token</text>
    <text x="196" y="156" text-anchor="middle" font-size="12.5" fill="#b3261e">有效信息 5~8%</text>
    <line x1="150" y1="164" x2="92" y2="206" stroke="#d93025" stroke-width="1.1"/>

    <rect x="580" y="398" width="212" height="46" rx="7" fill="#fdecea" stroke="#f5c6c1" transform="translate(0,-6)"/>
    <text x="686" y="417" text-anchor="middle" font-size="12.5" fill="#b3261e" font-weight="700" transform="translate(0,-6)">第 10 轮：约 15000 Token</text>
    <text x="686" y="436" text-anchor="middle" font-size="12.5" fill="#b3261e" transform="translate(0,-6)">有效信息 &lt; 2%</text>
  </g>

  <!-- 图例 -->
  <g font-size="13">
    <rect x="106" y="398" width="15" height="4.5" fill="#d93025" transform="translate(0,-4)"/>
    <text x="128" y="404" fill="#374151" transform="translate(0,-4)">未压缩会话</text>
    <rect x="106" y="424" width="15" height="4.5" fill="#1a73e8" transform="translate(0,-4)"/>
    <text x="128" y="430" fill="#374151" transform="translate(0,-4)">启用 L1/L2 渐进压缩（每次压缩后召回恢复）</text>
  </g>
</svg>
