<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif; fill:#1e293b; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .layer-name { font-size: 16px; font-weight: 700; }
    .box-name { font-size: 13.5px; font-weight: 700; }
    .box-desc { font-size: 11.5px; fill: #475569; }
    .code { font-family: 'Consolas','JetBrains Mono',monospace; font-size: 11.5px; }
    .code-sm { font-family: 'Consolas','JetBrains Mono',monospace; font-size: 10.5px; }
    .tag { font-size: 10.5px; font-weight: 700; }
  </style>

  <rect width="980" height="660" fill="#f8fafc"/>
  <text x="490" y="38" text-anchor="middle" class="title">工具层三层架构：模型只面对"描述"，执行全部收口</text>
  <text x="490" y="60" text-anchor="middle" class="subtitle">模型层 → 注册表层（Tool Registry）→ 实现通道（本地函数 / MCP Server）</text>

  <!-- Layer 1: Model -->
  <g>
    <rect x="40" y="84" width="900" height="118" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="58" y="110" class="layer-name" fill="#1d4ed8">① 模型层（LLM）</text>
    <text x="664" y="110" class="subtitle">只做决策：选哪个工具、填什么参数</text>

    <rect x="64" y="124" width="420" height="64" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="78" y="146" class="box-name">模型看到的：工具 Schema 列表</text>
    <text x="78" y="166" class="code">tools = [ {name, description, parameters} ... ]</text>

    <rect x="512" y="124" width="404" height="64" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="526" y="146" class="box-name">模型输出的：一次 tool_call（JSON）</text>
    <text x="526" y="166" class="code-sm">{"name":"edit_file","arguments":{"path":"a.py","old_string":"..."}}</text>
  </g>

  <line x1="490" y1="202" x2="490" y2="228" stroke="#0369a1" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="502" y="222" class="tag" fill="#0369a1">JSON 请求下行</text>

  <!-- Layer 2: Tool Registry -->
  <g>
    <rect x="40" y="230" width="900" height="172" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="58" y="256" class="layer-name" fill="#047857">② 注册表层（Tool Registry）— 生产环境真正的安全边界</text>
    <text x="708" y="256" class="subtitle">所有调用必经的唯一入口</text>

    <rect x="64" y="272" width="268" height="116" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="78" y="294" class="box-name">Schema 提供</text>
    <text x="78" y="314" class="code">TOOL_SCHEMAS</text>
    <text x="78" y="332" class="box-desc">统一格式：name / description /</text>
    <text x="78" y="348" class="box-desc">parameters(type, description)</text>
    <text x="78" y="370" class="code-sm">get_schemas_for_phase(turn)</text>

    <rect x="356" y="272" width="268" height="116" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="370" y="294" class="box-name">统一执行入口</text>
    <text x="370" y="314" class="code">execute_tool(name, args, config)</text>
    <text x="370" y="334" class="box-desc">① 白名单校验（name 存在？）</text>
    <text x="370" y="350" class="box-desc">② 阶段权限（规划期禁写）</text>
    <text x="370" y="366" class="box-desc">③ try/except 全量兜底</text>
    <text x="370" y="382" class="box-desc">任何异常都不让进程崩溃</text>

    <rect x="648" y="272" width="268" height="116" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="662" y="294" class="box-name">统一返回约定</text>
    <text x="662" y="314" class="code">tuple[bool, str]</text>
    <text x="662" y="334" class="box-desc">(True,  "结果内容...")   成功</text>
    <text x="662" y="350" class="box-desc">(False, "可读错误信息")  失败</text>
    <text x="662" y="372" class="box-desc">错误必须是"模型能读懂、</text>
    <text x="662" y="386" class="box-desc">能自行修正"的字符串</text>
  </g>

  <!-- split arrows -->
  <line x1="330" y1="402" x2="330" y2="432" stroke="#b45309" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="196" y="426" class="tag" fill="#b45309">结果上行（bool + str）</text>
  <line x1="660" y1="402" x2="660" y2="432" stroke="#0369a1" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowDown)"/>
  <text x="672" y="426" class="tag" fill="#0369a1">调用下行</text>

  <!-- Layer 3 -->
  <g>
    <rect x="40" y="434" width="900" height="176" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="58" y="460" class="layer-name" fill="#a16207">③ 实现通道层：工具"真正干活"的地方</text>

    <rect x="64" y="476" width="424" height="118" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="78" y="498" class="box-name">通道 A：本地函数工具（进程内）</text>
    <text x="78" y="518" class="code">TOOL_REGISTRY = {</text>
    <text x="78" y="534" class="code">  'read_file': tool_read_file,  'write_file': ...,</text>
    <text x="78" y="550" class="code">  'edit_file': ..., 'grep_search': ...,</text>
    <text x="78" y="566" class="code">  'glob_search': ..., 'bash': tool_bash }</text>
    <text x="78" y="586" class="box-desc">6 个 Python 函数直接实现，零网络依赖</text>

    <rect x="512" y="476" width="404" height="118" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="526" y="498" class="box-name">通道 B：MCP Server（跨进程）</text>
    <text x="526" y="518" class="code-sm">stdio      → 本地子进程（stdin/stdout，JSON-RPC）</text>
    <text x="526" y="534" class="code-sm">HTTP+SSE   → 远程服务（Streamable HTTP + OAuth）</text>
    <text x="526" y="554" class="box-desc">tools/list 拉取定义 → 拼进模型的 tools 列表</text>
    <text x="526" y="570" class="box-desc">tools/call 转发执行 → 结果转回 tuple[bool, str]</text>
    <text x="526" y="590" class="box-desc">对模型透明：换实现通道，Schema 结构不变</text>
  </g>

  <text x="490" y="640" text-anchor="middle" class="subtitle">关键设计：模型永远不知道工具由谁实现 —— 注册表层把"描述、调度、权限、兜底"全部收口</text>
</svg>
