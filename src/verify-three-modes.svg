<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="980" height="660" fill="#f8fafc"/>
  <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">开环 vs 闭环：三种验证模式对照（exp2）</text>
  <text x="490" y="68" text-anchor="middle" font-size="13" fill="#64748b">关键变量是「验证是谁的责任」：没人负责 → Agent 自决 → 框架强制</text>

  <!-- ===== 三列卡片 ===== -->
  <!-- O1 -->
  <rect x="40" y="100" width="285" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="40" y="100" width="285" height="52" rx="12" fill="#64748b"/>
  <rect x="40" y="126" width="285" height="26" fill="#64748b"/>
  <text x="182" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">O1_no_bash（开环）</text>
  <text x="182" y="140" text-anchor="middle" font-size="10.5" fill="#e2e8f0">read_file + edit_file，无 bash</text>
  <text x="58" y="180" font-size="12" fill="#334155">• Agent 物理上无法跑测试</text>
  <text x="58" y="202" font-size="12" fill="#334155">• 修完只能靠「推理」判断完成</text>
  <text x="58" y="224" font-size="12" fill="#334155">• 最纯粹的开环工作模式</text>
  <rect x="62" y="250" width="240" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="182" y="278" text-anchor="middle" font-size="24" font-weight="800" fill="#dc2626">40%</text>
  <text x="182" y="300" text-anchor="middle" font-size="11" fill="#b91c1c">pytest 通过率（2/5）</text>
  <text x="182" y="352" text-anchor="middle" font-size="10.5" fill="#64748b">隐藏 bug B 全部漏网</text>
  <text x="182" y="372" text-anchor="middle" font-size="10.5" fill="#64748b">= exp1 虚假阳性的根源</text>

  <!-- O2 -->
  <rect x="347" y="100" width="285" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="347" y="100" width="285" height="52" rx="12" fill="#f59e0b"/>
  <rect x="347" y="126" width="285" height="26" fill="#f59e0b"/>
  <text x="489" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">O2_bash_optional（自决）</text>
  <text x="489" y="140" text-anchor="middle" font-size="10.5" fill="#fffbeb">+bash 工具，prompt 不强制跑测试</text>
  <text x="365" y="180" font-size="12" fill="#334155">• Agent「想跑就跑」</text>
  <text x="365" y="202" font-size="12" fill="#334155">• b4 任务调用 bash 6 次</text>
  <text x="365" y="224" font-size="12" fill="#334155">• 仍然 FAIL——只做局部探查</text>
  <rect x="369" y="250" width="240" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="489" y="278" text-anchor="middle" font-size="24" font-weight="800" fill="#dc2626">40%</text>
  <text x="489" y="300" text-anchor="middle" font-size="11" fill="#b91c1c">pytest 通过率（2/5）</text>
  <text x="489" y="352" text-anchor="middle" font-size="10.5" fill="#64748b">给工具 ≠ 用对工具</text>
  <text x="489" y="372" text-anchor="middle" font-size="10.5" fill="#64748b">O2 ≈ O1 是反直觉核心发现</text>

  <!-- O3 -->
  <rect x="654" y="100" width="285" height="330" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="654" y="100" width="285" height="52" rx="12" fill="#16a34a"/>
  <rect x="654" y="126" width="285" height="26" fill="#16a34a"/>
  <text x="796" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">O3_harness_forced（闭环）</text>
  <text x="796" y="140" text-anchor="middle" font-size="10.5" fill="#dcfce7">框架强制 pytest + 失败回灌一次重试</text>
  <text x="672" y="180" font-size="12" fill="#334155">• Agent 报告完成 → 框架独立跑 pytest</text>
  <text x="672" y="202" font-size="12" fill="#334155">• 失败 → stderr 注入上下文 → 重试</text>
  <text x="672" y="224" font-size="12" fill="#334155">• 验证责任从模型移交给框架</text>
  <rect x="676" y="250" width="240" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="796" y="278" text-anchor="middle" font-size="24" font-weight="800" fill="#16a34a">80%~100%</text>
  <text x="796" y="300" text-anchor="middle" font-size="11" fill="#166534">pytest 通过率（smoke 4/5）</text>
  <text x="796" y="352" text-anchor="middle" font-size="10.5" fill="#64748b">1 次回灌重试 ≈ +$0.003</text>
  <text x="796" y="372" text-anchor="middle" font-size="10.5" fill="#64748b">换来 +40pp，性价比极高</text>

  <!-- ===== 中部对比箭头 ===== -->
  <line x1="325" y1="450" x2="347" y2="450" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="336" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">≈</text>
  <line x1="632" y1="450" x2="654" y2="450" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowBGreen)"/>
  <text x="643" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">+40pp</text>

  <!-- ===== 底部：最小验证闭环 ===== -->
  <text x="490" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">最小验证闭环（Verify Loop）：把「报告完成」变成「验证通过」</text>

  <rect x="80" y="530" width="180" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">① Generator 修改</text>
  <text x="170" y="572" text-anchor="middle" font-size="10.5" fill="#6d28d9">edit_file 完成修复，报告完成</text>

  <line x1="260" y1="558" x2="310" y2="558" stroke="#475569" stroke-width="1.6" marker-end="url(#arrowB)"/>

  <rect x="312" y="530" width="180" height="56" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="402" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">② 框架独立验证</text>
  <text x="402" y="572" text-anchor="middle" font-size="10.5" fill="#0369a1">pytest 全量跑，不信任自评</text>

  <line x1="492" y1="558" x2="542" y2="558" stroke="#475569" stroke-width="1.6" marker-end="url(#arrowB)"/>

  <!-- 菱形判断 -->
  <polygon points="628,530 748,558 628,586 508,558" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="628" y="553" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">测试全部</text>
  <text x="628" y="571" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">通过？</text>

  <!-- PASS 出口 -->
  <line x1="748" y1="558" x2="812" y2="558" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrowBGreen)"/>
  <text x="780" y="546" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">是</text>
  <rect x="814" y="530" width="130" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="879" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">✔ 任务完成</text>
  <text x="879" y="572" text-anchor="middle" font-size="10.5" fill="#166534">此时「完成」才有意义</text>

  <!-- FAIL 回灌 -->
  <path d="M 628,586 V 620 H 402 V 590" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowBRed)"/>
  <text x="640" y="616" font-size="11" font-weight="700" fill="#dc2626">否（回灌）</text>
  <text x="515" y="616" font-size="10.5" fill="#b91c1c">stderr 失败日志注入上下文 → Agent 带着错误信息重试</text>
</svg>
