<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="980" height="560" fill="#f8fafc"/>
  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">图 8-3 失败挖掘流水线：从 session.jsonl 到可审计候选变更（8.5）</text>

  <!-- 流水线主体：5 个阶段 -->
  <g>
    <rect x="30" y="80" width="165" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="112" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e40af">① 归一化</text>
    <text x="112" y="128" text-anchor="middle" font-size="11" fill="#64748b">normalize_session_event</text>
    <g font-size="11" fill="#1e3a8a">
      <text x="42" y="150">真实 schema：</text>
      <text x="42" y="166">type=tool_call/tool</text>
      <text x="42" y="186">教学 schema：</text>
      <text x="42" y="202">role=tool/tool_name</text>
    </g>

    <rect x="225" y="80" width="165" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="307" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#166534">② 错误分类</text>
    <text x="307" y="128" text-anchor="middle" font-size="11" fill="#64748b">classify_error (regex)</text>
    <g font-size="11" fill="#14532d">
      <text x="237" y="150">EditNotFound / FileNotFound</text>
      <text x="237" y="166">Permission / Timeout</text>
      <text x="237" y="182">ValueError / Context</text>
      <text x="237" y="198">Overflow / SensitiveData</text>
    </g>

    <rect x="420" y="80" width="165" height="120" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="502" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#854d0e">③ 聚合</text>
    <text x="502" y="128" text-anchor="middle" font-size="11" fill="#64748b">mine_failures</text>
    <g font-size="11" fill="#713f12">
      <text x="432" y="150">按 (tool, error_class)</text>
      <text x="432" y="166">分组计数，保留</text>
      <text x="432" y="182">error / prompt 证据</text>
      <text x="432" y="202">（Top-K 降序排列）</text>
    </g>

    <rect x="615" y="80" width="165" height="120" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
    <text x="697" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7e22ce">④ 分诊归因</text>
    <text x="697" y="128" text-anchor="middle" font-size="11" fill="#64748b">triage: LAYER_BY_ERROR</text>
    <g font-size="11" fill="#6b21a8">
      <text x="627" y="150">EditNotFound→工作流规则</text>
      <text x="627" y="166">Permission→约束层</text>
      <text x="627" y="182">ContextOverflow→上下文层</text>
      <text x="627" y="202">Other→golden_case</text>
    </g>

    <rect x="810" y="80" width="140" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="880" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#9a3412">⑤ 生成提案</text>
    <text x="880" y="128" text-anchor="middle" font-size="11" fill="#64748b">generate_candidate</text>
    <g font-size="11" fill="#9a3412">
      <text x="822" y="150">FeedbackCandidate</text>
      <text x="822" y="166">id=sha1前缀</text>
      <text x="822" y="182">hypothesis + 规则</text>
      <text x="822" y="202">validation_plan</text>
    </g>

    <path d="M195 140 L221 140" stroke="#475569" stroke-width="2.5" marker-end="url(#f1)"/>
    <path d="M390 140 L416 140" stroke="#475569" stroke-width="2.5" marker-end="url(#f1)"/>
    <path d="M585 140 L611 140" stroke="#475569" stroke-width="2.5" marker-end="url(#f1)"/>
    <path d="M780 140 L806 140" stroke="#475569" stroke-width="2.5" marker-end="url(#f1)"/>
  </g>

  <!-- LAYER_BY_ERROR 映射表 -->
  <rect x="30" y="240" width="470" height="290" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="265" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">错误类 → Harness 层（feedback_loop.py 实际矩阵）</text>
  <g font-size="12.5">
    <rect x="50" y="285" width="200" height="30" rx="6" fill="#f1f5f9"/><text x="60" y="305" fill="#334155">EditNotFound</text>
    <rect x="260" y="285" width="220" height="30" rx="6" fill="#eff6ff"/><text x="270" y="305" fill="#1e40af">→ workflow_rule 工作流规则</text>
    <rect x="50" y="323" width="200" height="30" rx="6" fill="#f1f5f9"/><text x="60" y="343" fill="#334155">FileNotFound / ValueError</text>
    <rect x="260" y="323" width="220" height="30" rx="6" fill="#f0fdf4"/><text x="270" y="343" fill="#166534">→ tool_contract 工具契约</text>
    <rect x="50" y="361" width="200" height="30" rx="6" fill="#f1f5f9"/><text x="60" y="381" fill="#334155">Permission / SensitiveData</text>
    <rect x="260" y="361" width="220" height="30" rx="6" fill="#fef2f2"/><text x="270" y="381" fill="#991b1b">→ constraint_layer 约束层</text>
    <rect x="50" y="399" width="200" height="30" rx="6" fill="#f1f5f9"/><text x="60" y="419" fill="#334155">Timeout</text>
    <rect x="260" y="399" width="220" height="30" rx="6" fill="#fdf4ff"/><text x="270" y="419" fill="#7e22ce">→ orchestration_layer 编排层</text>
    <rect x="50" y="437" width="200" height="30" rx="6" fill="#f1f5f9"/><text x="60" y="457" fill="#334155">ContextOverflow</text>
    <rect x="260" y="437" width="220" height="30" rx="6" fill="#fefce8"/><text x="270" y="457" fill="#854d0e">→ context_layer 上下文层</text>
    <rect x="50" y="475" width="200" height="30" rx="6" fill="#f1f5f9"/><text x="60" y="495" fill="#334155">Other（模式不明确）</text>
    <rect x="260" y="475" width="220" height="30" rx="6" fill="#fff7ed"/><text x="270" y="495" fill="#9a3412">→ golden_case 先固化为回归用例</text>
  </g>

  <!-- 硬门禁卡 -->
  <rect x="530" y="240" width="420" height="290" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="740" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">提案必须过 4 项硬门禁（evaluate_gate）</text>
  <g font-size="12.5" fill="#7f1d1d">
    <text x="550" y="300">① safety_escape_rate 安全逃逸率：不回退</text>
    <text x="550" y="330">② forbidden_call_rate 违禁调用率：不回退</text>
    <text x="550" y="360">③ accuracy 准确率：不回退</text>
    <text x="550" y="390">④ cost_delta 成本涨幅：≤ 15%</text>
  </g>
  <rect x="550" y="412" width="380" height="42" rx="8" fill="#fee2e2"/>
  <text x="740" y="430" text-anchor="middle" font-size="11.5" fill="#991b1b">任一项违反 → GateDecision(accepted=False)</text>
  <text x="740" y="447" text-anchor="middle" font-size="11.5" fill="#991b1b">候选被挡在 Shadow 之前，不得进入灰度</text>
  <rect x="550" y="466" width="380" height="42" rx="8" fill="#dcfce7"/>
  <text x="740" y="484" text-anchor="middle" font-size="11.5" fill="#166534">全部通过 → 进入 Shadow → Canary → Promote</text>
  <text x="740" y="501" text-anchor="middle" font-size="11.5" fill="#166534">同时生成 ChangeManifest（rollback_tag 可随时回滚）</text>

  <defs>
    <marker id="f1" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#475569"/></marker>
  </defs>
</svg>
