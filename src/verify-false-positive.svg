<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="640" fill="#f8fafc"/>
  <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Agent 自评的虚假阳性：报告完成 ≠ 真的完成</text>
  <text x="490" y="68" text-anchor="middle" font-size="13" fill="#64748b">exp1（DeepSeek-V3，无 bash，12 任务）：P(self_report=DONE ∧ pytest=FAIL) = 60%</text>

  <!-- ===== 左侧：四象限判定矩阵 ===== -->
  <text x="250" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">四象限判定矩阵（每条 trial 的 4 元状态）</text>

  <!-- 轴标签 -->
  <text x="250" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">pytest 独立验证 →</text>

  <!-- 列标题 -->
  <text x="345" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">pytest PASS</text>
  <text x="565" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">pytest FAIL</text>
  <!-- 行标题 -->
  <text x="118" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">Agent 自评</text>
  <text x="118" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">DONE</text>
  <text x="118" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">Agent 自评</text>
  <text x="118" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">NOT_DONE</text>

  <!-- 象限1: DONE+PASS 真完成 -->
  <rect x="240" y="185" width="210" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="345" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">真完成 (TP)</text>
  <text x="345" y="240" text-anchor="middle" font-size="11.5" fill="#166534">自评可信，闭环成立</text>
  <text x="345" y="258" text-anchor="middle" font-size="11.5" fill="#166534">exp1 中占 DONE 的 40%</text>

  <!-- 象限2: DONE+FAIL 虚假阳性 -->
  <rect x="460" y="185" width="210" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="565" y="215" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">虚假阳性 (FP) ★</text>
  <text x="565" y="237" text-anchor="middle" font-size="11.5" fill="#b91c1c">说完成了，测试却挂——核心指标</text>
  <text x="565" y="255" text-anchor="middle" font-size="11.5" fill="#b91c1c">exp1 中占 DONE 的 60%</text>
  <text x="565" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">FPR = #(DONE∩FAIL) / #(DONE)</text>

  <!-- 象限3: NOT_DONE+PASS -->
  <rect x="240" y="305" width="210" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="345" y="338" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">多余的悲观</text>
  <text x="345" y="360" text-anchor="middle" font-size="11.5" fill="#475569">其实做对了却不敢报完成</text>
  <text x="345" y="378" text-anchor="middle" font-size="11.5" fill="#475569">（罕见，无害）</text>

  <!-- 象限4: NOT_DONE+FAIL -->
  <rect x="460" y="305" width="210" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="565" y="338" text-anchor="middle" font-size="13.5" font-weight="600" fill="#334155">真未完成 (TN)</text>
  <text x="565" y="360" text-anchor="middle" font-size="11.5" fill="#475569">自评诚实</text>
  <text x="565" y="378" text-anchor="middle" font-size="11.5" fill="#475569">—</text>

  <!-- 底部注释 -->
  <rect x="60" y="440" width="640" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="380" y="465" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">为什么自评不可信：Agent 的思考路径不可观察，它的「完成」只是对上下文的自洽叙述</text>
  <text x="380" y="488" text-anchor="middle" font-size="11.5" fill="#3b82f6">prompt 报告了 bug A、没提隐藏 bug B → Agent 修完 A 就宣布完成，pytest 却被 B 击穿</text>

  <!-- ===== 右侧：METR 对照 ===== -->
  <rect x="726" y="110" width="234" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="726" y="110" width="234" height="40" rx="12" fill="#0f172a"/>
  <rect x="726" y="134" width="234" height="16" fill="#0f172a"/>
  <text x="843" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">工业界佐证：METR 2026-03</text>

  <text x="742" y="176" font-size="11.5" font-weight="700" fill="#0f172a">《Many SWE-bench-Passing</text>
  <text x="742" y="193" font-size="11.5" font-weight="700" fill="#0f172a">PRs Would Not Be Merged》</text>
  <text x="742" y="218" font-size="11" fill="#475569">4 位资深维护者盲审</text>
  <text x="742" y="235" font-size="11" fill="#475569">296 个通过 SWE-bench</text>
  <text x="742" y="252" font-size="11" fill="#475569">自动评测的 PR：</text>
  <text x="742" y="280" font-size="12" font-weight="700" fill="#dc2626">自动评测通过率 ≈ 人类</text>
  <text x="742" y="298" font-size="12" font-weight="700" fill="#dc2626">合并率的 2 倍</text>
  <text x="742" y="322" font-size="10.5" fill="#64748b">合并率低于评测通过率 24.2pp</text>

  <rect x="726" y="370" width="234" height="134" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="742" y="398" font-size="12" font-weight="700" fill="#9a3412">bug 类别敏感性</text>
  <text x="742" y="422" font-size="11" fill="#9a3412">异常处理 / 边界条件类 bug</text>
  <text x="742" y="439" font-size="11" fill="#9a3412">的虚假阳性率显著高于</text>
  <text x="742" y="456" font-size="11" fill="#9a3412">off-by-one：不跑测试</text>
  <text x="742" y="473" font-size="11" fill="#9a3412">几乎不可能「看出」</text>
  <text x="742" y="494" font-size="10.5" fill="#c2410c">→ 推理性自评有结构性盲区</text>
</svg>
