<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-label="系统提示词五区段组装：基础规则、项目上下文、任务规则、工具定义为静态前缀，经 DYNAMIC_BOUNDARY 与当前任务动态后缀分隔，右侧为 128K 窗口 Token 预算">
  <style>
    text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;}
    .t{font-size:18px;font-weight:700;fill:#171717;}
    .n-title{font-size:14px;font-weight:600;fill:#171717;}
    .n-sub{font-size:12px;fill:#52525B;}
    .mono{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;}
    .ct{font-size:12.5px;font-weight:600;fill:#52525B;}
  </style>
  <defs>
    <marker id="arr-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>

  <text x="30" y="36" class="t">系统提示词的五区段组装</text>
  <text x="30" y="58" class="n-sub">图 5-2 复现 · 前 4 区段在一次生命周期内不变 —— 这是 Prompt Cache 高效命中的前提</text>

  <!-- 左侧五区段 -->
  <rect x="60" y="84" width="320" height="62" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="76" y="110" class="n-title">① 基础规则</text>
  <text x="76" y="132" class="n-sub" font-size="11.5">角色 · 执行协议 · 安全边界</text>

  <rect x="60" y="154" width="320" height="62" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="76" y="180" class="n-title">② 项目上下文</text>
  <text x="76" y="202" class="n-sub" font-size="11.5">CLAUDE.md · AGENTS.md 注入内容</text>

  <rect x="60" y="224" width="320" height="62" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="76" y="250" class="n-title">③ 任务规则</text>
  <text x="76" y="272" class="n-sub" font-size="11.5">.claude/rules/ 按 applies_to 条件注入</text>

  <rect x="60" y="294" width="320" height="62" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="76" y="320" class="n-title">④ 工具定义</text>
  <text x="76" y="342" class="n-sub" font-size="11.5">Tool Schemas（顺序固定，前 3 轮只放只读工具）</text>

  <!-- 动静边界 -->
  <line x1="60" y1="368" x2="380" y2="368" stroke="#171717" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="140" y="356" width="160" height="24" rx="12" fill="#FFF7E6" stroke="#D97706"/>
  <text x="220" y="372" text-anchor="middle" class="mono" font-size="11" fill="#B45309">DYNAMIC_BOUNDARY</text>

  <rect x="60" y="384" width="320" height="62" rx="8" fill="#FFF7E6" stroke="#D97706"/>
  <text x="76" y="410" class="n-title" fill="#B45309">⑤ 当前任务</text>
  <text x="76" y="432" class="n-sub" font-size="11.5">日期 · cwd · 用户消息（每轮变化）</text>

  <text x="60" y="472" class="mono" font-size="11" fill="#52525B">build_system_prompt(cwd, tools_description)</text>
  <text x="60" y="492" class="mono" font-size="11" fill="#52525B">return '\n'.join(parts)</text>

  <!-- 右括号：静态前缀 -->
  <path d="M 392 84 h 8 V 356 h -8" fill="none" stroke="#4B3FE3" stroke-width="1.5"/>
  <text x="410" y="200" class="n-title" fill="#4B3FE3">静态前缀</text>
  <text x="410" y="220" class="n-sub">生命周期内不变</text>
  <text x="410" y="240" class="n-sub" fill="#4B3FE3">→ 命中读缓存 0.1×</text>
  <text x="410" y="416" class="n-title" fill="#B45309">动态后缀</text>
  <text x="410" y="436" class="n-sub">每轮变化 · 全价计费</text>

  <!-- 右侧：Token 预算 -->
  <rect x="490" y="84" width="240" height="284" rx="8" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)"/>
  <text x="506" y="110" class="n-title">128K 窗口的 Token 预算</text>
  <text x="506" y="130" class="n-sub" font-size="11">表 5-4 · 预算分配建议</text>

  <text x="506" y="158" class="n-sub" font-size="11">系统提示词</text>
  <text x="714" y="158" text-anchor="end" class="mono" font-size="10.5" fill="#52525B">12800 · 10%</text>
  <rect x="506" y="164" width="42" height="14" rx="4" fill="#4B3FE3" opacity="0.55"/>

  <text x="506" y="196" class="n-sub" font-size="11">历史会话</text>
  <text x="714" y="196" text-anchor="end" class="mono" font-size="10.5" fill="#52525B">64000 · 50%</text>
  <rect x="506" y="202" width="208" height="14" rx="4" fill="#4B3FE3"/>

  <text x="506" y="234" class="n-sub" font-size="11">当前轮工具返回</text>
  <text x="714" y="234" text-anchor="end" class="mono" font-size="10.5" fill="#52525B">25600 · 20%</text>
  <rect x="506" y="240" width="83" height="14" rx="4" fill="#4B3FE3" opacity="0.85"/>

  <text x="506" y="272" class="n-sub" font-size="11">输出预留</text>
  <text x="714" y="272" text-anchor="end" class="mono" font-size="10.5" fill="#52525B">19200 · 15%</text>
  <rect x="506" y="278" width="62" height="14" rx="4" fill="#4B3FE3" opacity="0.7"/>

  <text x="506" y="310" class="n-sub" font-size="11">Memory（规则与记忆）</text>
  <text x="714" y="310" text-anchor="end" class="mono" font-size="10.5" fill="#52525B">6400 · 5%</text>
  <rect x="506" y="316" width="21" height="14" rx="4" fill="#4B3FE3" opacity="0.4"/>

  <text x="506" y="352" class="n-sub" font-size="10.5">历史会话随轮数增长，是主要消耗源</text>

  <!-- 底部经验值 -->
  <text x="490" y="398" class="n-sub">• 系统提示词是固定成本，越小越好</text>
  <text x="490" y="420" class="n-sub">• Memory 承载项目级长期知识，会话期内稳定</text>
  <text x="490" y="442" class="n-sub">• CLAUDE.md + MEMORY.md 建议 ≤ 200 行</text>
  <text x="490" y="464" class="n-sub">• 单个上下文文件截断 content[:40_000]</text>
  <text x="490" y="486" class="n-sub">• 压缩时 Memory 的 5% 空间不随历史被压缩</text>
</svg>
