<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700">
  <style>
    text { font-family: 'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif; fill:#1e293b; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .tool-name { font-size: 14.5px; font-weight: 700; font-family: 'Consolas','JetBrains Mono',monospace; fill: #0f766e; }
    .tool-job { font-size: 11.5px; fill: #475569; }
    .tool-safe { font-size: 11px; font-weight: 600; fill: #b45309; }
    .code { font-family: 'Consolas','JetBrains Mono',monospace; font-size: 12px; }
    .head { font-size: 13.5px; font-weight: 700; }
    .note { font-size: 11.5px; fill: #475569; }
  </style>

  <rect width="980" height="700" fill="#f8fafc"/>
  <text x="490" y="36" text-anchor="middle" class="title">6 个基础工具：一份统一契约，四处防呆设计</text>
  <text x="490" y="58" text-anchor="middle" class="subtitle">所有工具遵守同一签名与返回约定 —— 模型学会一个，就会用全部</text>

  <!-- unified contract -->
  <rect x="60" y="78" width="860" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="490" y="104" text-anchor="middle" class="code" fill="#1d4ed8">def tool_xxx(args: dict, config) -> tuple[bool, str]</text>
  <text x="490" y="128" text-anchor="middle" class="subtitle">bool = 是否成功；str = 给模型看的消息（成功是结果、失败是可修正的提示）</text>

  <!-- tools grid: 2 rows x 3 cols -->
  <g>
    <!-- row 1 -->
    <rect x="60" y="164" width="270" height="150" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="78" y="190" class="tool-name">read_file</text>
    <text x="78" y="212" class="tool-job">读文件；offset / limit 分页读大文件</text>
    <text x="78" y="230" class="tool-job">描述只写一句："Use offset/limit</text>
    <text x="78" y="245" class="tool-job">for large files."</text>
    <text x="78" y="270" class="tool-safe">防呆：smart_decode 兜底编码</text>
    <text x="78" y="288" class="tool-safe">（UTF-16 BOM / lossy UTF-8）</text>
    <text x="78" y="304" class="tool-safe">超长截断，保证单次返回可控</text>

    <rect x="355" y="164" width="270" height="150" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="373" y="190" class="tool-name">write_file</text>
    <text x="373" y="212" class="tool-job">整文件覆盖写；返回写入字节数</text>
    <text x="373" y="236" class="tool-safe">防呆：路径逃逸检查</text>
    <text x="373" y="252" class="tool-safe">relative_to 判定是否越出 cwd</text>
    <text x="373" y="276" class="tool-safe">为什么不用 startswith？</text>
    <text x="373" y="292" class="tool-safe">/project 是 /project_secret 的前缀</text>
    <text x="373" y="308" class="tool-safe">→ 前缀碰撞会放行越界路径</text>

    <rect x="650" y="164" width="270" height="150" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
    <text x="668" y="190" class="tool-name">edit_file</text>
    <text x="668" y="212" class="tool-job">old_string 必须在文件中唯一匹配</text>
    <text x="668" y="228" class="tool-job">（count == 1 才替换）</text>
    <text x="668" y="252" class="tool-safe">防呆核心：匹配 0 处 → 报"未找到"</text>
    <text x="668" y="268" class="tool-safe">匹配 &gt;1 处 → 报"请带 2–3 行上下文"</text>
    <text x="668" y="284" class="tool-safe">把空白不匹配（whitespace mismatch）</text>
    <text x="668" y="300" class="tool-safe">变成模型可自我修正的错误信号，</text>
    <text x="668" y="316" class="tool-safe">而不是静默改错位置</text>

    <!-- row 2 -->
    <rect x="60" y="330" width="270" height="150" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="78" y="356" class="tool-name">grep_search</text>
    <text x="78" y="378" class="tool-job">按内容搜：返回"匹配的行"</text>
    <text x="78" y="402" class="tool-safe">描述强调：返回匹配行内容</text>
    <text x="78" y="418" class="tool-safe">（不是文件路径，不是正则教程）</text>
    <text x="78" y="442" class="tool-safe">契约分工：搜"内容"用 grep，</text>
    <text x="78" y="458" class="tool-safe">搜"文件名"用 glob —— 描述里写死，</text>
    <text x="78" y="474" class="tool-safe">消除两个工具的语义重叠</text>

    <rect x="355" y="330" width="270" height="150" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="373" y="356" class="tool-name">glob_search</text>
    <text x="373" y="378" class="tool-job">按模式搜：返回"文件路径列表"</text>
    <text x="373" y="402" class="tool-safe">防呆：与 grep 的返回格式刻意不同</text>
    <text x="373" y="418" class="tool-safe">一个给行文本、一个给路径，</text>
    <text x="373" y="434" class="tool-safe">模型不必二次分辨输出类型</text>
    <text x="373" y="458" class="tool-safe">命名唯一、零同义词</text>
    <text x="373" y="474" class="tool-safe">（search/find/lookup 只留一个词）</text>

    <rect x="650" y="330" width="270" height="150" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
    <text x="668" y="356" class="tool-name">bash</text>
    <text x="668" y="378" class="tool-job">执行 shell 命令，合并 stdout/stderr</text>
    <text x="668" y="402" class="tool-safe">防呆三件套：</text>
    <text x="668" y="418" class="tool-safe">① 黑名单：rm -rf / mkfs / dd if= ...</text>
    <text x="668" y="434" class="tool-safe">② 后台线程读输出 + 超时强杀</text>
    <text x="668" y="450" class="tool-safe">③ Windows 下优选 Git Bash，</text>
    <text x="668" y="466" class="tool-safe">并排除 WindowsApps 里的 WSL stub</text>
    <text x="668" y="482" class="tool-safe">（find_best_bash 环境探测）</text>
  </g>

  <!-- common defense band -->
  <rect x="60" y="496" width="860" height="84" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="80" y="522" class="head">公共防线（在 execute_tool 统一入口后面，6 个工具全部继承）</text>
  <text x="80" y="546" class="note">白名单校验 → 阶段权限（规划期只读）→ try/except 全量兜底 → 错误一律转为 tuple[False, 可读消息] 上行给模型</text>
  <text x="80" y="566" class="note">任何异常都不崩溃进程：错误的本质是"给模型的反馈信号"，不是"程序的失败状态"</text>

  <!-- new tool criteria -->
  <rect x="60" y="596" width="860" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="622" class="head" fill="#1d4ed8">什么时候才新增工具？（4.5.2 两个条件，缺一不可）</text>
  <text x="80" y="646" class="note">① 现有工具组合确实无法完成该操作（能力闭包之外）；</text>
  <text x="80" y="666" class="note">② 用现有工具需多次调用且高频出错（例如 bash 反复转圈 → 才值得拆成专用工具）。bash 误用率已从 15% 降到 3% 以下。</text>
</svg>
